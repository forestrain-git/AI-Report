name: Deploy deck-ai-awakening to Pages

on:
  push:
    branches: [main]
    paths:
      - 'ppt/deck-ai-awakening/index.html'
      - 'ppt/deck-ai-awakening/shared/**'
      - 'ppt/deck-ai-awakening/slides/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage publish dir (whitelist)
        run: |
          mkdir -p _site/shared _site/slides
          cp ppt/deck-ai-awakening/index.html _site/
          cp -r ppt/deck-ai-awakening/shared/. _site/shared/
          cp -r ppt/deck-ai-awakening/slides/. _site/slides/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
