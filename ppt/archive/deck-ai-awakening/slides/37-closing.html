<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P39 · 行动 &amp; 自由交流</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: var(--dark-bg);
    color: var(--dark-ink);
    padding: 0 160px;
  }
  .deco-square {
    border-color: rgba(255,255,255,0.08);
    width: 500px;
    height: 500px;
  }
  .deco-square-inner {
    border-color: rgba(255,255,255,0.08);
    width: 360px;
    height: 360px;
  }
  .content {
    position: relative;
    z-index: 2;
    max-width: 1000px;
  }
  h1 {
    font-size: 60px;
    font-weight: 900;
    margin: 0 0 28px 0;
  }
  .things {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 32px;
  }
  .thing {
    padding: 18px 28px;
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    text-align: left;
  }
  .thing-num {
    font-family: "Inter", sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.15em;
    margin-bottom: 8px;
  }
  .thing-text {
    font-size: 24px;
    line-height: 1.6;
  }
  .thing-text strong {
    font-weight: 700;
  }
  .cta {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 20px;
  }
  .qr-hint {
    font-size: 18px;
    color: var(--dark-muted);
    margin-bottom: 8px;
  }
  .qr-placeholder {
    width: 220px;
    height: 220px;
    background: rgba(255,255,255,0.1);
    border-radius: 8px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: var(--dark-muted);
    overflow: hidden;
  }
  .qr-placeholder img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .thanks {
    margin-top: 24px;
    font-size: 40px;
    font-weight: 900;
  }
  .page-num {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    font-family: "Inter", sans-serif;
    font-size: 14px;
    color: var(--dark-muted);
    letter-spacing: 0.15em;
  }
</style>
</head>
<body>
  <div class="deco-square"></div>
  <div class="deco-square-inner"></div>
  <div class="content">
    <h1>行动 &amp; 自由交流</h1>
    <div class="things">
      <div class="thing">
        <div class="thing-num">第一件</div>
        <div class="thing-text">关于花钱——学 AI 这件事上，<strong>舍得花点小钱在对的工具上。</strong>一杯咖啡的钱，能买你一个月的生产力。</div>
      </div>
      <div class="thing">
        <div class="thing-num">第二件</div>
        <div class="thing-text">关于今晚——回去挑<strong>一件你这周最常做的活</strong>，<strong>今晚就用 AI 干一遍。</strong></div>
      </div>
      <div class="thing">
        <div class="thing-num">第三件</div>
        <div class="thing-text">关于今天——<strong>不吹、不黑、不说教。</strong>真实经历，仅供参考。</div>
      </div>
    </div>
    <div class="cta">不用等培训，不用等批复。今天，打开你常用的那个 AI 工具，问它一个你正在头疼的问题。这就是开始。</div>
    <div class="qr-hint">扫码领取「今晚动手包」</div>
    <div class="qr-placeholder"><img src="../assets/今晚动手包-二维码.png" alt="扫码加入"></div>
    <div class="thanks">谢谢大家</div>
  </div>
  <div class="page-num">39 / 39</div>
</body>
</html>
