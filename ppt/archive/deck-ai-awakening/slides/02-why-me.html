<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P2 · 为什么我来分享</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    padding: 100px 140px 80px;
    background: var(--bg);
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .kicker { margin-bottom: 24px; }
  h1 {
    font-size: 72px;
    font-weight: 900;
    margin: 0 0 60px 0;
    line-height: 1.15;
  }
  .timeline {
    display: flex;
    gap: 0;
    margin-bottom: 60px;
  }
  .time-item {
    flex: 1;
    padding: 36px 40px;
    border-left: 3px solid var(--primary-light);
    position: relative;
  }
  .time-item:first-child {
    border-left: none;
    padding-left: 0;
  }
  .time-year {
    font-family: "Inter", sans-serif;
    font-size: 48px;
    font-weight: 700;
    color: var(--primary);
    line-height: 1;
    margin-bottom: 12px;
  }
  .time-label {
    font-size: 22px;
    color: var(--muted);
    line-height: 1.6;
  }
  .time-item.highlight {
    background: var(--primary);
    border-left: none;
    border-radius: 4px;
  }
  .time-item.highlight .time-year,
  .time-item.highlight .time-label {
    color: #fff;
  }
  .summary {
    font-size: 28px;
    line-height: 1.8;
    color: var(--ink);
  }
  .summary strong {
    color: var(--primary);
  }
</style>
</head>
<body>
  <div class="top-bar"></div>
  <div class="content">
    <div class="kicker">Why Me</div>
    <h1>为什么是我来讲 AI？</h1>
    <div class="timeline">
      <div class="time-item">
        <div class="time-year">2002</div>
        <div class="time-label">入行做程序员</div>
      </div>
      <div class="time-item">
        <div class="time-year">2009</div>
        <div class="time-label">加入中建</div>
      </div>
      <div class="time-item highlight">
        <div class="time-year">16年</div>
        <div class="time-label">2009-2025<br>一行代码都没写过</div>
      </div>
    </div>
    <div class="summary">
      过去两个月，从轻度用 AI 到<strong>重度依赖 AI</strong>，冲击远超预期。<br>
      不讲大道理、不讲技术原理——就分享我走过的路、踩过的坑、得到的东西。<br>
      <strong>希望我的弯路，大家不必再走一遍。</strong>
    </div>
  </div>
  <div class="page-footer">
    <span class="section-name">开场</span>
    <span class="page-num">02 / 39</span>
  </div>
</body>
</html>
