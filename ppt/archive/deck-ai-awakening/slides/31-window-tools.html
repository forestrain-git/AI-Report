<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P33 · 窗口工具</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    padding: 100px 140px 80px;
    background: var(--bg);
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .kicker { margin-bottom: 20px; }
  h1 {
    font-size: 64px;
    font-weight: 900;
    margin: 0 0 48px 0;
  }
  .tools-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    margin-bottom: 48px;
  }
  .tool-card {
    padding: 28px;
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(15,23,42,0.03);
  }
  .tool-name {
    font-size: 24px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 8px;
  }
  .tool-desc {
    font-size: 18px;
    line-height: 1.6;
    color: var(--muted);
  }
  .principle {
    padding: 28px 40px;
    background: var(--primary-light);
    border-radius: 4px;
    font-size: 24px;
    line-height: 1.7;
    color: var(--ink);
    text-align: center;
  }
  .principle strong {
    color: var(--primary);
  }
</style>
</head>
<body>
  <div class="top-bar"></div>
  <div class="content">
    <div class="kicker">Part 2 &middot; 工具矩阵</div>
    <h1>窗口工具</h1>
    <div class="tools-grid">
      <div class="tool-card">
        <div class="tool-name">豆包</div>
        <div class="tool-desc">情绪价值 + 抖音视频解析，视频信息提取很方便</div>
      </div>
      <div class="tool-card">
        <div class="tool-name">通义千问</div>
        <div class="tool-desc">会议录音转文字，速度快、识别准</div>
      </div>
      <div class="tool-card">
        <div class="tool-name">GPT-4 / Claude</div>
        <div class="tool-desc">顶级模型，幻觉率较低，重要问题主要参考它们</div>
      </div>
      <div class="tool-card">
        <div class="tool-name">Nano Banana</div>
        <div class="tool-desc">原型图快速生成，一句话出一个 UI 草图</div>
      </div>
      <div class="tool-card">
        <div class="tool-name">谷歌 AI Studio</div>
        <div class="tool-desc">前端界面开发的好搭档</div>
      </div>
    </div>
    <div class="principle">
      <strong>别因为追求"深度"，就放弃了"快"。</strong><br>
      很多简单任务——译一段话、查一个概念、生成一个表格——网页打开就完事了。
    </div>
  </div>
  <div class="page-footer">
    <span class="section-name">Part 2：工具矩阵</span>
    <span class="page-num">33 / 39</span>
  </div>
</body>
</html>
