  <div class="top-bar"></div>
  <div class="content">
    <div class="kicker">Part 2 &middot; 工具矩阵</div>
    <h1>Kimi</h1>
    <div class="intro">
      国内做得 <strong>最朴实、最稳</strong> 的那一类——厂商把框架搭好了，灵活性有限，但朴实而快。
      真正让我离不开的，不是 PPT，不是长文，是它的 <strong>"深度研究"</strong>。
    </div>
    <div class="highlight">
      <div class="highlight-title">多 agent 蜂群工作机制</div>
      <div class="highlight-desc">
        你给一个研究题目，它自动拆任务：一只 agent 去查公开资料，一只抓行业报告，一只对比同行案例，再一只汇总、交叉验证、生成结构化报告。
        几十只 agent 同时跑，像一窝蜜蜂——这就是"蜂群"。
      </div>
    </div>

      <div class="scene">
        <div class="scene-icon">&#10003;</div>

      <div class="scene">
        <div class="scene-icon">&#10003;</div>
        <div class="scene-text"><strong>深度研究</strong>——上传几十份资料，让蜂群自己跑</div>
      </div>
      <div class="scene">
        <div class="scene-icon">&#10003;</div>
        <div class="scene-text"><strong>内容初稿</strong>——结构化、模板化的内容</div>
