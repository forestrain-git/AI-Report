<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P3 · 今天说三件事</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    padding: 100px 160px 80px;
    background: var(--bg);
  }
  .header {
    margin-bottom: 64px;
    text-align: center;
    position: relative;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -28px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 3px;
    background: var(--primary);
  }
  .kicker { justify-content: center; display: flex; }
  h1 {
    font-size: 64px;
    font-weight: 900;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .items {
    display: flex;
    flex-direction: column;
    gap: 28px;
    flex: 1;
    justify-content: center;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 0;
    background: #fff;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(15,23,42,0.04);
  }
  .item:nth-child(3) {
    box-shadow: 0 4px 20px rgba(30,58,95,0.08);
    border: 1px solid var(--primary-light);
  }
  .num-col {
    width: 120px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 36px 0;
    background: var(--bg);
    border-right: 1px solid var(--primary-light);
  }
  .item:nth-child(3) .num-col {
    background: var(--primary);
    border-right: none;
  }
  .num {
    font-family: "Inter", sans-serif;
    font-size: 40px;
    font-weight: 700;
    color: var(--primary);
    line-height: 1;
  }
  .item:nth-child(3) .num { color: #fff; }
  .item-body {
    flex: 1;
    padding: 32px 40px;
    display: flex;
    align-items: center;
    gap: 40px;
  }
  .item-main { flex: 1; }
  .item-title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 6px;
    line-height: 1.3;
  }
  .item-desc {
    font-size: 18px;
    line-height: 1.6;
    color: var(--muted);
  }
  .item-meta {
    font-family: "Inter", sans-serif;
    font-size: 16px;
    color: var(--primary);
    font-weight: 600;
    letter-spacing: 0.05em;
    text-align: right;
    white-space: nowrap;
  }
  .footer-note {
    margin-top: 48px;
    font-size: 22px;
    color: var(--primary);
    font-weight: 700;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="top-bar"></div>
  <div class="header">
    <div class="kicker">Agenda</div>
    <h1>今天说三件事</h1>
  </div>
  <div class="items">
    <div class="item">
      <div class="num-col"><div class="num">01</div></div>
      <div class="item-body">
        <div class="item-main">
          <div class="item-title">AI 觉醒四阶段</div>
          <div class="item-desc">两个月实际经历的四个阶段——从「高级搜索引擎」到「不失忆的工作平台」。</div>
        </div>
        <div class="item-meta">约 45 分钟</div>
      </div>
    </div>
    <div class="item">
      <div class="num-col"><div class="num">02</div></div>
      <div class="item-body">
        <div class="item-main">
          <div class="item-title">当前工具矩阵</div>
          <div class="item-desc">哪个场景用什么工具——窗口工具、Kimi、龙虾、Claude Code。</div>
        </div>
        <div class="item-meta">约 10 分钟</div>
      </div>
    </div>
    <div class="item">
      <div class="num-col"><div class="num">03</div></div>
      <div class="item-body">
        <div class="item-main">
          <div class="item-title">思考与建议</div>
          <div class="item-desc">前面都是经历，这一块是最想跟各位说的话——心法、学法、用法。</div>
        </div>
        <div class="item-meta">约 15 分钟 &middot; 重点</div>
      </div>
    </div>
  </div>
  <div class="footer-note">「 第三块，希望大家最认真听 」</div>
  <div class="page-footer">
    <span class="section-name">开场</span>
    <span class="page-num">03 / 39</span>
  </div>
</body>
</html>
