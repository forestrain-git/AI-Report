<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P22 · AI 时代学习方法</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    padding: 100px 140px 80px;
    background: var(--bg);
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .kicker { margin-bottom: 20px; }
  h1 {
    font-size: 56px;
    font-weight: 900;
    margin: 0 0 40px 0;
  }
  .advice-pair {
    display: flex;
    gap: 24px;
    margin-bottom: 48px;
  }
  .advice {
    flex: 1;
    padding: 32px;
    background: var(--primary);
    color: #fff;
    border-radius: 4px;
    text-align: center;
    font-size: 28px;
    font-weight: 700;
  }
  .method-title {
    font-size: 24px;
    color: var(--muted);
    margin-bottom: 32px;
  }
  .method-title strong {
    color: var(--primary);
  }
  .steps {
    display: flex;
    gap: 20px;
  }
  .step {
    flex: 1;
    padding: 28px;
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(15,23,42,0.03);
    text-align: center;
  }
  .step-num {
    font-family: "Inter", sans-serif;
    font-size: 40px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 12px;
  }
  .step-text {
    font-size: 20px;
    line-height: 1.6;
    color: var(--ink);
  }
  .step-text strong {
    color: var(--primary);
  }
  .conclusion {
    margin-top: 40px;
    font-size: 28px;
    font-weight: 700;
    color: var(--primary);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="top-bar"></div>
  <div class="content">
    <div class="kicker">Stage 3 &middot; 启示</div>
    <h1>AI 时代的学习方法</h1>
    <div class="advice-pair">
      <div class="advice">别光看，要用</div>
      <div class="advice">别先学再用，直接用，在用中学</div>
    </div>
    <div class="method-title">传统路径：<strong>先看书 &rarr; 看视频 &rarr; 做练习 &rarr; 实战</strong>——这条路太慢了。</div>
    <div class="steps">
      <div class="step">
        <div class="step-num">01</div>
        <div class="step-text">让 AI 提炼这个领域 <strong>20% 的核心知识</strong></div>
      </div>
      <div class="step">
        <div class="step-num">02</div>
        <div class="step-text">用这 20% 带你做出 <strong>最简单的 MVP</strong></div>
      </div>
      <div class="step">
        <div class="step-num">03</div>
        <div class="step-text">针对里面的知识点，<strong>逐个摸清</strong></div>
      </div>
      <div class="step">
        <div class="step-num">04</div>
        <div class="step-text"><strong>快速入门</strong>——用起来以后才回过头补理论</div>
      </div>
    </div>
    <div class="conclusion">阶段三讲完。下面进阶段四，调子开始往上转折。</div>
  </div>
  <div class="page-footer">
    <span class="section-name">阶段三：龙虾依赖期</span>
    <span class="page-num">22 / 39</span>
  </div>
</body>
</html>
