<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P26 · LLM + Wiki 范式</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    padding: 100px 140px 80px;
    background: var(--bg);
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .kicker { margin-bottom: 20px; }
  h1 {
    font-size: 64px;
    font-weight: 900;
    margin: 0 0 48px 0;
  }
  .author {
    font-size: 22px;
    color: var(--muted);
    margin-bottom: 40px;
  }
  .author strong {
    color: var(--primary);
  }
  .concept {
    display: flex;
    gap: 32px;
    margin-bottom: 48px;
  }
  .concept-card {
    flex: 1;
    padding: 36px;
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(15,23,42,0.03);
    text-align: center;
  }
  .concept-card.primary {
    background: var(--primary);
    color: #fff;
  }
  .concept-name {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .concept-desc {
    font-size: 20px;
    line-height: 1.6;
    opacity: 0.85;
  }
  .plus {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    font-weight: 300;
    color: var(--primary);
  }
  .result {
    padding: 36px;
    background: var(--primary-light);
    border-radius: 4px;
    text-align: center;
    margin-bottom: 40px;
  }
  .result-text {
    font-size: 32px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 12px;
  }
  .result-sub {
    font-size: 22px;
    color: var(--muted);
  }
  .insight {
    font-size: 24px;
    line-height: 1.7;
    color: var(--muted);
    text-align: center;
  }
  .insight strong {
    color: var(--primary);
  }
</style>
</head>
<body>
  <div class="top-bar"></div>
  <div class="content">
    <div class="kicker">Stage 4 &middot; 范式</div>
    <h1>LLM + Wiki 范式</h1>
    <div class="author">OpenAI 早期核心成员 <strong>Andrej Karpathy</strong> 正式提出的范式</div>
    <div class="concept">
      <div class="concept-card">
        <div class="concept-name">LLM</div>
        <div class="concept-desc">大语言模型有推理能力<br>但<strong>有上下文限制</strong></div>
      </div>
      <div class="plus">+</div>
      <div class="concept-card primary">
        <div class="concept-name">Wiki</div>
        <div class="concept-desc">结构化知识库有持久记忆<br>但<strong>不会思考</strong></div>
      </div>
    </div>
    <div class="result">
      <div class="result-text">有记忆的推理 &middot; 有推理的记忆</div>
      <div class="result-sub">让一个聪明的脑子，配一个不会忘事的资料库</div>
    </div>
    <div class="insight">
      Karpathy 真正的革命性变革——<strong>把人从冗繁的知识库构建里解脱出来</strong>，
      让人专注做价值判断；让大模型去干整理资料、建立链接这些机械活。
    </div>
  </div>
  <div class="page-footer">
    <span class="section-name">阶段四：CC 依赖期</span>
    <span class="page-num">26 / 39</span>
  </div>
