<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P27 团队全面转型</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #FAFBFC; font-family: var(--font-body); color: var(--ink-primary); }
  .slide { width: 100%; height: 100%; position: relative; padding: 80px 120px; display: flex; flex-direction: column; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
  .frame { position: absolute; inset: 48px; border: 1px solid rgba(37,99,235,0.12); pointer-events: none; }
  .corner { position: absolute; width: 20px; height: 20px; border: 2px solid rgba(30,58,95,0.4); }
  .corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .corner.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  .hud-top { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: rgba(30,58,95,0.6); letter-spacing: 0.08em; margin-bottom: 48px; z-index: 1; }
  .header { margin-bottom: 48px; z-index: 1; }
  .header h1 { font-family: var(--font-display); font-size: 72px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-primary); margin-bottom: 16px; }
  .header .underline { width: 60px; height: 4px; background: #1E3A5F; box-shadow: 0 0 12px rgba(30,58,95,0.3); }

  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; z-index: 1; }
  .intro { text-align: center; font-size: 22px; color: var(--ink-secondary); margin-bottom: 40px; }
  .intro strong { color: #1E3A5F; }
  .cases { display: flex; flex-direction: column; gap: 16px; }
  .case { display: flex; gap: 24px; padding: 20px 32px; border: 1px solid rgba(37,99,235,0.12); align-items: center; }
  .case .tag { font-family: var(--font-mono); font-size: 11px; color: rgba(37,99,235,0.5); letter-spacing: 0.1em; min-width: 80px; }
  .case .text { font-size: 20px; color: var(--ink-primary); }
  .case .text span { color: var(--ink-tertiary); font-size: 16px; }
  .case.highlight { border-color: rgba(30,58,95,0.2); background: rgba(30,58,95,0.04); }
  .hud-bot { display: flex; justify-content: space-between; font-size: 12px; color: rgba(15,23,42,0.5); letter-spacing: 0.08em; margin-top: 24px; z-index: 1; }
  .hud-bot span { color: rgba(30,58,95,0.5); }
</style>
</head>
<body>
<div class="slide">
  <div class="grid"></div>
  <div class="frame">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div class="hud-top">
    <span>PART 1 · 阶段四</span>
    <span class="badge" style="border:1px solid rgba(30,58,95,0.4);padding:3px 12px;color:rgba(30,58,95,0.8);background:rgba(30,58,95,0.04)">转型</span>
    <span>27 / 39</span>
  </div>
  <div class="header">
    <h1>团队全面转型</h1>
    <div class="underline"></div>
  </div>
  <div class="body">
    <div class="intro">逼迫团队全部使用 CC + OB 做知识库 · 让每个人都成为<strong>全栈</strong></div>
    <div class="cases">
      <div class="case">
        <div class="tag">PRODUCT</div>
        <div class="text">招标系统快速开发 · 产品研发全面使用 AI，不允许自己写代码</div>
      </div>
      <div class="case">
        <div class="tag">PROJECT</div>
        <div class="text">管理学院项目深入合作推进 · 江阴项目起死回生</div>
      </div>
      <div class="case">
        <div class="tag">AI SERVICE</div>
        <div class="text">承接 AI 项目，掌握大模型本地化部署和调优</div>
      </div>
      <div class="case">
        <div class="tag">ONTOLOGY</div>
        <div class="text">掌握帕兰迪尔本体论，与物联、运营场景深度结合</div>
      </div>
      <div class="case highlight">
        <div class="tag">GOAL</div>
        <div class="text">一个人搞定售前、产品、研发、测试、交付 · <strong>快速向一家 AI 公司转型</strong></div>
      </div>
    </div>
    <div class="link-box" style="text-align:center;margin-top:24px;">
      <a href="https://bid.csceccloud.net:8443/#/dashboard" style="display:inline-block;padding:14px 40px;border:1px solid rgba(30,58,95,0.4);color:#1E3A5F;font-size:16px;letter-spacing:0.1em;text-decoration:none;font-family:var(--font-mono);background:rgba(30,58,95,0.08);">> 现场打开招标系统演示</a>
    </div>
  </div>
  <div class="hud-bot">
    <span>[43:00] 累计</span>
    <span>团队转型 · 全栈能力拓展</span>
  </div>
</div>
</body>
</html>
