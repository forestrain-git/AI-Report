
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P19 老产品经理救场</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #FAFBFC; font-family: var(--font-body); color: var(--ink-primary); }
  .slide { width: 100%; height: 100%; position: relative; padding: 80px 120px; display: flex; flex-direction: column; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
  .frame { position: absolute; inset: 48px; border: 1px solid rgba(37,99,235,0.12); pointer-events: none; }
  .corner { position: absolute; width: 20px; height: 20px; border: 2px solid rgba(30,58,95,0.4); }
  .corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .corner.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  .hud-top { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: rgba(30,58,95,0.6); letter-spacing: 0.08em; margin-bottom: 48px; z-index: 1; }
  .header { margin-bottom: 48px; z-index: 1; }
  .header h1 { font-family: var(--font-display); font-size: 72px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-primary); margin-bottom: 16px; }
  .header .underline { width: 60px; height: 4px; background: #1E3A5F; box-shadow: 0 0 12px rgba(30,58,95,0.3); }

  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; z-index: 1; }
  .scene { text-align: center; margin-bottom: 48px; }
  .scene .time { font-family: var(--font-mono); font-size: 14px; color: rgba(30,58,95,0.5); letter-spacing: 0.2em; margin-bottom: 16px; }
  .scene .title { font-size: 36px; color: var(--ink-primary); letter-spacing: 0.05em; }
  .scene .title strong { color: #1E3A5F; }
  .cards { display: flex; gap: 32px; justify-content: center; }
  .card { flex: 1; max-width: 480px; padding: 40px; border: 1px solid rgba(37,99,235,0.15); }
  .card.fail { border-color: rgba(220,80,60,0.15); background: rgba(220,80,60,0.02); }
  .card.save { border-color: rgba(30,58,95,0.2); background: rgba(30,58,95,0.04); }
  .card .label { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.15em; margin-bottom: 16px; }
  .card.fail .label { color: rgba(220,80,60,0.5); }
  .card.save .label { color: rgba(30,58,95,0.5); }
  .card .text { font-size: 22px; color: var(--ink-primary); line-height: 1.6; }
  .card .text span { color: var(--ink-tertiary); font-size: 18px; }
  .arrow { display: flex; align-items: center; font-size: 32px; color: rgba(30,58,95,0.6); }
  .conclusion { text-align: center; margin-top: 48px; font-size: 24px; color: var(--ink-secondary); }
  .conclusion strong { color: #1E3A5F; }
  .hud-bot { display: flex; justify-content: space-between; font-size: 12px; color: rgba(15,23,42,0.5); letter-spacing: 0.08em; margin-top: 24px; z-index: 1; }
  .hud-bot span { color: rgba(30,58,95,0.5); }
</style>
</head>
<body>
<div class="slide">
  <div class="grid"></div>
  <div class="frame">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div class="hud-top">
    <span>PART 1 · 阶段三</span>
    <span class="badge" style="border:1px solid rgba(30,58,95,0.4);padding:3px 12px;color:rgba(30,58,95,0.8);background:rgba(30,58,95,0.04)">兜底</span>
    <span>19 / 39</span>
  </div>
  <div class="header">
    <h1>老产品经理救场</h1>
    <div class="underline"></div>
  </div>
  <div class="body">
    <div class="scene">
      <div class="time">交活前夜 · 22:00</div>
      <div class="title">龙虾<strong>再一次</strong>完整重构后，我崩溃了</div>
    </div>
    <div class="cards">
      <div class="card fail">
        <div class="label">LOBSTER LINE</div>
        <div class="text">初设主线<br><span>个人翻车</span></div>
      </div>
      <div class="arrow">→</div>
      <div class="card save">
        <div class="label">BACKUP LINE</div>
        <div class="text">老产品经理手搓到凌晨<br><span>第二天如期交付 · 业主无异议</span></div>
      </div>
    </div>
    <div class="conclusion">今晚救我的不是龙虾，是<strong>那个我留的"手搓兜底"</strong></div>
  </div>
  <div class="hud-bot">
    <span>[28:30] 累计</span>
    <span>兜底备份 · 人的价值</span>
  </div>
</div>
</body>
</html>
