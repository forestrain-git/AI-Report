<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P9 信心爆棚 + 大型项目机会</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: #FAFBFC;
    font-family: var(--font-body);
    color: var(--ink-primary);
  }
  .slide {
    width: 100%; height: 100%;
    position: relative;
    padding: 80px 120px;
    display: flex;
    flex-direction: column;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .frame {
    position: absolute; inset: 48px;
    border: 1px solid rgba(37,99,235,0.12);
    pointer-events: none;
  }
  .corner { position: absolute; width: 20px; height: 20px; border: 2px solid rgba(30,58,95,0.4); }
  .corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .corner.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  .hud-top {
    display: flex; justify-content: space-between;
    font-family: var(--font-mono); font-size: 11px;
    color: rgba(30,58,95,0.6); letter-spacing: 0.08em;
    margin-bottom: 48px; z-index: 1;
  }
  .header { margin-bottom: 48px; z-index: 1; }
  .header h1 {
    font-family: var(--font-display); font-size: 72px;
    font-weight: 700; letter-spacing: 0.06em; color: var(--ink-primary); margin-bottom: 16px;
  }
  .header .underline { width: 60px; height: 4px; background: #1E3A5F; box-shadow: 0 0 12px rgba(30,58,95,0.3); }

  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; z-index: 1; }
  .curve-area {
    position: relative; height: 300px; margin-bottom: 48px;
    border-left: 2px solid rgba(30,58,95,0.2);
    border-bottom: 2px solid rgba(30,58,95,0.2);
    margin-left: 60px;
  }
  .curve-line {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 100%;
    background: linear-gradient(90deg, rgba(37,99,235,0.2) 0%, rgba(30,58,95,0.4) 40%, rgba(30,58,95,0.6) 60%, rgba(30,58,95,0.3) 100%);
    clip-path: polygon(0 80%, 20% 60%, 40% 20%, 60% 10%, 80% 30%, 100% 40%, 100% 100%, 0 100%);
  }
  .curve-dot {
    position: absolute; width: 16px; height: 16px; border-radius: 50%;
    background: #1E3A5F; box-shadow: 0 0 16px rgba(30,58,95,0.5);
  }
  .curve-dot.start { bottom: 18%; left: 40%; }
  .curve-dot.peak { bottom: 88%; left: 60%; }
  .curve-dot.end { bottom: 58%; left: 80%; }
  .curve-label {
    position: absolute; font-size: 14px; color: var(--ink-tertiary);
    font-family: var(--font-mono);
  }
  .key-quote {
    text-align: center; font-size: 32px; color: var(--ink-primary);
    letter-spacing: 0.05em; line-height: 1.6;
  }
  .key-quote strong {
    color: #1E3A5F; font-weight: 700;
    text-shadow: 0 0 20px rgba(30,58,95,0.25);
  }
  .hud-bot {
    display: flex; justify-content: space-between;
    font-size: 12px; color: rgba(15,23,42,0.5);
    letter-spacing: 0.08em; margin-top: 24px; z-index: 1;
  }
  .hud-bot span { color: rgba(30,58,95,0.5); }
</style>
</head>
<body>
<div class="slide">
  <div class="grid"></div>
  <div class="frame">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div class="hud-top">
    <span>PART 1 · 阶段二</span>
    <span class="badge" style="border:1px solid rgba(30,58,95,0.4);padding:3px 12px;color:rgba(30,58,95,0.8);background:rgba(30,58,95,0.04)">心理状态</span>
    <span>09 / 39</span>
  </div>
  <div class="header">
    <h1>信心爆棚 + 大型项目机会</h1>
    <div class="underline"></div>
  </div>
  <div class="body">
    <div class="curve-area">
      <div class="curve-line"></div>
      <div class="curve-dot start"></div>
      <div class="curve-dot peak"></div>
      <div class="curve-dot end"></div>
    </div>
    <div class="key-quote">
      典型心理状态 —— <strong>过度自信</strong><br>
      「AI 时代来了，咱们什么都能干」<br>
      <span style="font-size:22px;color:var(--ink-tertiary)">冒进归冒进，客观上推高了行动力</span>
    </div>
  </div>
  <div class="hud-bot">
    <span>[10:30] 累计</span>
    <span>情绪曲线 · 上扬调子</span>
  </div>
</div>
</body>
</html>
