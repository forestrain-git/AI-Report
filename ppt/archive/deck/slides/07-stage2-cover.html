<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P7 阶段二封面</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: #FAFBFC;
    font-family: var(--font-body);
    color: var(--ink-primary);
  }
  .slide {
    width: 100%; height: 100%;
    position: relative;
    padding: 80px 120px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .frame {
    position: absolute; inset: 48px;
    border: 1px solid rgba(37,99,235,0.12);
    pointer-events: none;
  }
  .corner { position: absolute; width: 20px; height: 20px; border: 2px solid rgba(30,58,95,0.4); }
  .corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .corner.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  .stage-label {
    font-family: var(--font-mono); font-size: 14px;
    color: rgba(30,58,95,0.5); letter-spacing: 0.3em;
    margin-bottom: 32px; z-index: 1;
  }
  .title {
    font-family: var(--font-display); font-size: 80px;
    font-weight: 700; letter-spacing: 0.06em;
    color: var(--ink-primary); text-align: center;
    margin-bottom: 24px; z-index: 1;
    line-height: 1.2;
  }
  .title .gold { color: #1E3A5F; }
  .divider {
    width: 80px; height: 3px; background: #1E3A5F;
    box-shadow: 0 0 16px rgba(30,58,95,0.4);
    margin-bottom: 32px; z-index: 1;
  }
  .subtitle {
    font-family: var(--font-display); font-size: 28px;
    color: var(--ink-secondary); letter-spacing: 0.1em;
    z-index: 1;
  }
  .highlight-box {
    margin-top: 48px; padding: 20px 48px;
    border: 1px solid rgba(30,58,95,0.4);
    background: rgba(30,58,95,0.08);
    font-size: 22px; color: #1E3A5F;
    letter-spacing: 0.1em; z-index: 1;
  }
  .hud-bot {
    position: absolute; bottom: 56px; left: 120px; right: 120px;
    display: flex; justify-content: space-between;
    font-size: 12px; color: rgba(15,23,42,0.5);
    letter-spacing: 0.08em; z-index: 1;
  }
  .hud-bot span { color: rgba(30,58,95,0.5); }
</style>
</head>
<body>
<div class="slide">
  <div class="grid"></div>
  <div class="frame">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div class="stage-label">STAGE 02 · 上扬调子</div>
  <h1 class="title">一个 24 年前的高级程序员<br>的<span class="gold">觉醒</span></h1>
  <div class="divider"></div>
  <p class="subtitle">3 月上半月 · 10 分钟，被震住了</p>
  <div class="highlight-box"></span>这不是几倍的效率提升，这是百倍的效率提升</div>
  <div class="hud-bot">
    <span>P7 / 39</span>
    <span>[08:00] 累计 · 阶段二开始</span>
  </div>
</div>
</body>
</html>
