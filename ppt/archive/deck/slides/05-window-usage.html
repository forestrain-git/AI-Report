<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P5 我的使用方式</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: #FAFBFC;
    font-family: var(--font-body);
    color: var(--ink-primary);
  }
  .slide {
    width: 100%; height: 100%;
    position: relative;
    padding: 80px 120px;
    display: flex;
    flex-direction: column;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .frame {
    position: absolute; inset: 48px;
    border: 1px solid rgba(37,99,235,0.12);
    pointer-events: none;
  }
  .corner { position: absolute; width: 20px; height: 20px; border: 2px solid rgba(30,58,95,0.4); }
  .corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .corner.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  .hud-top {
    display: flex; justify-content: space-between;
    font-family: var(--font-mono); font-size: 11px;
    color: rgba(30,58,95,0.6); letter-spacing: 0.08em;
    margin-bottom: 48px; z-index: 1;
  }
  .header { margin-bottom: 64px; z-index: 1; }
  .header h1 {
    font-family: var(--font-display); font-size: 72px;
    font-weight: 700; letter-spacing: 0.06em; color: var(--ink-primary); margin-bottom: 16px;
  }
  .header .underline { width: 60px; height: 4px; background: #1E3A5F; box-shadow: 0 0 12px rgba(30,58,95,0.3); }

  .body { flex: 1; display: flex; align-items: center; justify-content: center; z-index: 1; }
  .flow-wrap {
    display: flex; align-items: center; gap: 24px;
  }
  .flow-step {
    display: flex; flex-direction: column; align-items: center;
    gap: 16px; padding: 32px 40px;
    border: 1px solid rgba(37,99,235,0.2);
    background: rgba(37,99,235,0.04);
    min-width: 200px;
  }
  .flow-step .icon {
    font-size: 36px; color: #1E3A5F;
    font-family: var(--font-mono);
  }
  .flow-step .label {
    font-size: 22px; color: var(--ink-primary);
    font-weight: 600; letter-spacing: 0.05em;
  }
  .flow-step .desc {
    font-size: 14px; color: var(--ink-tertiary);
    text-align: center;
  }
  .flow-arrow {
    font-size: 28px; color: rgba(30,58,95,0.6);
    font-family: var(--font-mono);
  }
  .conclusion {
    margin-top: 64px; text-align: center;
    font-size: 28px; color: var(--ink-secondary);
    letter-spacing: 0.05em;
  }
  .conclusion strong {
    color: #1E3A5F; font-weight: 700;
  }
  .hud-bot {
    display: flex; justify-content: space-between;
    font-size: 12px; color: rgba(15,23,42,0.5);
    letter-spacing: 0.08em; margin-top: 32px; z-index: 1;
  }
  .hud-bot span { color: rgba(30,58,95,0.5); }
</style>
</head>
<body>
<div class="slide">
  <div class="grid"></div>
  <div class="frame">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div class="hud-top">
    <span>PART 1 · 阶段一</span>
    <span class="badge" style="border:1px solid rgba(30,58,95,0.4);padding:3px 12px;color:rgba(30,58,95,0.8);background:rgba(30,58,95,0.04)">窗口依赖期</span>
    <span>05 / 39</span>
  </div>
  <div class="header">
    <h1>我的使用方式</h1>
    <div class="underline"></div>
  </div>
  <div class="body">
    <div style="text-align:center">
      <div class="flow-wrap">
        <div class="flow-step">
          <div class="icon">?</div>
          <div class="label">提问</div>
          <div class="desc">豆包 / Kimi / 千问</div>
        </div>
        <div class="flow-arrow">→</div>
        <div class="flow-step">
          <div class="icon">📋</div>
          <div class="label">复制</div>
          <div class="desc">答案到手</div>
        </div>
        <div class="flow-arrow">→</div>
        <div class="flow-step">
          <div class="icon">📄</div>
          <div class="label">粘贴</div>
          <div class="desc">放进 Word</div>
        </div>
        <div class="flow-arrow">→</div>
        <div class="flow-step" style="border-color:rgba(30,58,95,0.2);background:rgba(30,58,95,0.04)">
          <div class="icon" style="color:rgba(15,23,42,0.4)">✕</div>
          <div class="label" style="color:var(--ink-tertiary)">关闭</div>
          <div class="desc">用完即弃</div>
        </div>
      </div>
      <div class="conclusion">
        每一次对话都是孤立的 · 每一次对话都是一次性的<br>
        <strong>AI ≈ 加强版百度</strong>
      </div>
    </div>
  </div>
  <div class="hud-bot">
    <span>[03:30] 累计</span>
    <span>结构性局限 · 用完即弃</span>
  </div>
</div>
</body>
</html>
