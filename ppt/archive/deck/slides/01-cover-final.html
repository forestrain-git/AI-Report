<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>封面 · 融合定稿版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: #FAFBFC;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    color: #0F172A;
  }
  .slide {
    width: 100%; height: 100%;
    position: relative;
    padding: 80px 120px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* ── 蓝图网格 ── */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(30,58,95,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,58,95,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .grid::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(45deg, transparent 49.9%, rgba(0,0,0,0.03) 49.9%, rgba(0,0,0,0.03) 50.1%, transparent 50.1%);
    background-size: 160px 160px;
  }

  /* ── 外框角标 ── */
  .frame {
    position: absolute;
    inset: 48px;
    border: 1px solid rgba(30,58,95,0.18);
    pointer-events: none;
  }
  .corner {
    position: absolute;
    width: 24px; height: 24px;
    border: 2px solid rgba(30,58,95,0.5);
  }
  .corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .corner.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  /* ── 顶部 HUD ── */
  .hud-top {
    display: flex;
    justify-content: space-between;
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 11px;
    color: rgba(30,58,95,0.6);
    letter-spacing: 0.1em;
    z-index: 1;
  }
  .hud-top span {
    border: 1px solid rgba(30,58,95,0.25);
    padding: 4px 14px;
    background: rgba(30,58,95,0.04);
  }

  /* ── 中部：标题区 ── */
  .center {
    flex: 1;
    display: flex;
    align-items: center;
    position: relative;
    z-index: 1;
  }
  .title-block {
    position: relative;
    padding-left: 80px;
  }
  /* 竖线 */
  .title-block::before {
    content: '';
    position: absolute;
    left: 0;
    top: 10px; bottom: 10px;
    width: 3px;
    background: linear-gradient(180deg, transparent, #1E3A5F, transparent);
    box-shadow: 0 0 20px rgba(30,58,95,0.4);
  }
  .eyebrow {
    font-family: "SF Mono", monospace;
    font-size: 13px;
    color: rgba(184,149,79,0.7);
    letter-spacing: 0.25em;
    margin-bottom: 32px;
  }
  .title {
    font-family: "Noto Sans SC", "PingFang SC", sans-serif;
    font-size: 120px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: 0.06em;
    color: #0F172A;
    margin-bottom: 32px;
  }
  .title .gold {
    color: #1E3A5F;
    text-shadow: 0 0 40px rgba(184,149,79,0.15);
  }
  .subtitle {
    font-family: "Noto Sans SC", sans-serif;
    font-size: 32px;
    color: rgba(15,23,42,0.55);
    letter-spacing: 0.12em;
  }
  /* 装饰圆环 */
  .orbit {
    position: absolute;
    right: 180px;
    top: 50%;
    transform: translateY(-50%);
    width: 400px;
    height: 400px;
    border: 1px solid rgba(30,58,95,0.18);
    border-radius: 50%;
    pointer-events: none;
  }
  .orbit::before {
    content: '';
    position: absolute;
    inset: 60px;
    border: 1px solid rgba(30,58,95,0.12);
    border-radius: 50%;
  }
  .orbit::after {
    content: '';
    position: absolute;
    top: -3px; left: 50%;
    transform: translateX(-50%);
    width: 6px; height: 6px;
    background: #1E3A5F;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(184,149,79,0.4);
  }
  /* 标注线 */
  .dim-line {
    position: absolute;
    right: 100px;
    top: 55%;
    width: 80px;
    height: 1px;
    background: rgba(0,0,0,0.08);
  }
  .dim-line::after {
    content: '70 min';
    position: absolute;
    right: -60px;
    top: -7px;
    font-family: "SF Mono", monospace;
    font-size: 10px;
    color: rgba(0,0,0,0.25);
  }

  /* ── 底部 HUD ── */
  .hud-bot {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-size: 13px;
    color: rgba(15,23,42,0.35);
    letter-spacing: 0.1em;
    z-index: 1;
  }
  .hud-bot .co {
    font-size: 16px;
    letter-spacing: 0.2em;
    color: rgba(15,23,42,0.5);
  }
  .hud-bot .scale {
    font-family: "SF Mono", monospace;
    font-size: 11px;
    color: rgba(30,58,95,0.5);
  }
</style>
</head>
<body>
<div class="slide">
  <div class="grid"></div>
  <div class="frame">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
  </div>

  <div class="hud-top">
    <span>PROJECT: AI-AWAKENING-2026</span>
    <span>DEPT: CSCEC INTELLIGENT</span>
    <span>CLASS: INTERNAL SHARE</span>
  </div>

  <div class="center">
    <div class="title-block">
      <div class="eyebrow">EXPERIENCE SHARING</div>
      <h1 class="title">AI <span class="gold">觉醒</span><br>经历分享</h1>
      <p class="subtitle">一个老程序员两个月的记录</p>
    </div>
    <div class="orbit"></div>
    <div class="dim-line"></div>
  </div>

  <div class="hud-bot">
    <div class="co">中建智能技术有限公司</div>
    <div class="scale">SCALE 1:1  |  39 SLIDES  |  70 MIN</div>
  </div>
</div>
</body>
</html>
