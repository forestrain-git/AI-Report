
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P17 三省六部制</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #FAFBFC; font-family: var(--font-body); color: var(--ink-primary); }
  .slide { width: 100%; height: 100%; position: relative; padding: 80px 120px; display: flex; flex-direction: column; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
  .frame { position: absolute; inset: 48px; border: 1px solid rgba(37,99,235,0.12); pointer-events: none; }
  .corner { position: absolute; width: 20px; height: 20px; border: 2px solid rgba(30,58,95,0.4); }
  .corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .corner.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  .hud-top { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: rgba(30,58,95,0.6); letter-spacing: 0.08em; margin-bottom: 48px; z-index: 1; }
  .header { margin-bottom: 40px; z-index: 1; }
  .header h1 { font-family: var(--font-display); font-size: 72px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-primary); margin-bottom: 16px; }
  .header .underline { width: 60px; height: 4px; background: #1E3A5F; box-shadow: 0 0 12px rgba(30,58,95,0.3); }

  .body { flex: 1; display: flex; flex-direction: column; z-index: 1; }
  .org-chart { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
  .org-box { padding: 24px; border: 1px solid rgba(37,99,235,0.15); background: rgba(37,99,235,0.03); text-align: center; }
  .org-box.sheng { border-color: rgba(30,58,95,0.6); background: rgba(30,58,95,0.08); }
  .org-box .name { font-size: 22px; font-weight: 600; color: var(--ink-primary); margin-bottom: 8px; }
  .org-box .role { font-size: 14px; color: var(--ink-tertiary); }
  .bu-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
  .bu-box { padding: 20px 12px; border: 1px solid rgba(37,99,235,0.12); text-align: center; }
  .bu-box .name { font-size: 18px; font-weight: 600; color: var(--ink-primary); margin-bottom: 6px; }
  .bu-box .role { font-size: 12px; color: var(--ink-tertiary); }
  .logic { margin-top: 32px; text-align: center; font-size: 20px; color: var(--ink-secondary); }
  .logic strong { color: #1E3A5F; }
  .hud-bot { display: flex; justify-content: space-between; font-size: 12px; color: rgba(15,23,42,0.5); letter-spacing: 0.08em; margin-top: 24px; z-index: 1; }
  .hud-bot span { color: rgba(30,58,95,0.5); }
</style>
</head>
<body>
<div class="slide">
  <div class="grid"></div>
  <div class="frame">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div class="hud-top">
    <span>PART 1 · 阶段三</span>
    <span class="badge" style="border:1px solid rgba(30,58,95,0.4);padding:3px 12px;color:rgba(30,58,95,0.8);background:rgba(30,58,95,0.04)">组织架构</span>
    <span>17 / 39</span>
  </div>
  <div class="header">
    <h1>三省六部制 —— 各司其职</h1>
    <div class="underline"></div>
  </div>
  <div class="body">
    <div class="org-chart">
      <div class="org-box sheng"><div class="name">中书省</div><div class="role">起草</div></div>
      <div class="org-box sheng"><div class="name">门下省</div><div class="role">审议</div></div>
      <div class="org-box sheng"><div class="name">尚书省</div><div class="role">执行·统筹</div></div>
    </div>
    <div class="bu-row">
      <div class="bu-box"><div class="name">吏部</div><div class="role">管"人"</div></div>
      <div class="bu-box"><div class="name">户部</div><div class="role">管钱·资料</div></div>
      <div class="bu-box"><div class="name">礼部</div><div class="role">对外行文</div></div>
      <div class="bu-box"><div class="name">兵部</div><div class="role">资源调度</div></div>
      <div class="bu-box"><div class="name">刑部</div><div class="role">验证·纠错</div></div>
      <div class="bu-box"><div class="name">工部</div><div class="role">干活·出方案</div></div>
    </div>
    <div class="logic">主龙虾接活 → 尚书省拆分 → 六部执行 → 刑部审 → 门下省过 → 主龙虾交付<br><strong>短期记忆压力分摊到每个子部门</strong></div>
  </div>
  <div class="hud-bot">
    <span>[24:30] 累计</span>
    <span>龙虾架构 · 各司其职</span>
  </div>
</div>
</body>
</html>
