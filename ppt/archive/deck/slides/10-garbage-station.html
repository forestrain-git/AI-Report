<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P10 垃圾中转站智能管理系统</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: #FAFBFC;
    font-family: var(--font-body);
    color: var(--ink-primary);
  }
  .slide {
    width: 100%; height: 100%;
    position: relative;
    padding: 80px 120px;
    display: flex;
    flex-direction: column;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .frame {
    position: absolute; inset: 48px;
    border: 1px solid rgba(37,99,235,0.12);
    pointer-events: none;
  }
  .corner { position: absolute; width: 20px; height: 20px; border: 2px solid rgba(30,58,95,0.4); }
  .corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .corner.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  .hud-top {
    display: flex; justify-content: space-between;
    font-family: var(--font-mono); font-size: 11px;
    color: rgba(30,58,95,0.6); letter-spacing: 0.08em;
    margin-bottom: 48px; z-index: 1;
  }
  .header { margin-bottom: 48px; z-index: 1; }
  .header h1 {
    font-family: var(--font-display); font-size: 72px;
    font-weight: 700; letter-spacing: 0.06em; color: var(--ink-primary); margin-bottom: 16px;
  }
  .header .underline { width: 60px; height: 4px; background: #1E3A5F; box-shadow: 0 0 12px rgba(30,58,95,0.3); }

  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; z-index: 1; }
  .project-card {
    border: 1px solid rgba(30,58,95,0.2);
    background: rgba(30,58,95,0.03);
    padding: 48px 64px; margin-bottom: 48px;
  }
  .project-card .label {
    font-family: var(--font-mono); font-size: 12px;
    color: rgba(30,58,95,0.5); letter-spacing: 0.15em;
    margin-bottom: 16px;
  }
  .project-card .title {
    font-family: var(--font-display); font-size: 48px; font-weight: 700;
    color: var(--ink-primary); letter-spacing: 0.05em; margin-bottom: 16px;
  }
  .project-card .desc {
    font-size: 22px; color: var(--ink-secondary); line-height: 1.6;
  }
  .crisis-wrap {
    display: flex; gap: 48px; align-items: center;
    justify-content: center;
  }
  .crisis-box {
    text-align: center; padding: 32px 48px;
    border: 1px solid rgba(37,99,235,0.15);
  }
  .crisis-box .time {
    font-family: var(--font-display); font-size: 64px; font-weight: 700;
    color: #1E3A5F; line-height: 1;
  }
  .crisis-box .label {
    font-size: 18px; color: var(--ink-tertiary); margin-top: 8px;
    letter-spacing: 0.1em;
  }
  .crisis-arrow {
    font-size: 32px; color: rgba(30,58,95,0.6);
  }
  .anxiety-bar {
    margin-top: 48px; text-align: center;
  }
  .anxiety-bar .bar-label {
    font-size: 14px; color: var(--ink-tertiary); letter-spacing: 0.15em;
    margin-bottom: 12px; font-family: var(--font-mono);
  }
  .anxiety-bar .bar {
    width: 600px; height: 8px; margin: 0 auto;
    background: rgba(0,0,0,0.06);
    position: relative;
  }
  .anxiety-bar .bar-fill {
    position: absolute; top: 0; left: 0; height: 100%; width: 95%;
    background: linear-gradient(90deg, rgba(30,58,95,0.3), #1E3A5F);
    box-shadow: 0 0 20px rgba(30,58,95,0.3);
  }
  .hud-bot {
    display: flex; justify-content: space-between;
    font-size: 12px; color: rgba(15,23,42,0.5);
    letter-spacing: 0.08em; margin-top: 24px; z-index: 1;
  }
  .hud-bot span { color: rgba(30,58,95,0.5); }
</style>
</head>
<body>
<div class="slide">
  <div class="grid"></div>
  <div class="frame">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div class="hud-top">
    <span>PART 1 · 阶段二</span>
    <span class="badge" style="border:1px solid rgba(30,58,95,0.4);padding:3px 12px;color:rgba(30,58,95,0.8);background:rgba(30,58,95,0.04)">压力测试</span>
    <span>10 / 39</span>
  </div>
  <div class="header">
    <h1>垃圾中转站智能管理系统</h1>
    <div class="underline"></div>
  </div>
  <div class="body">
    <div class="project-card">
      <div class="label">PROJECT BRIEF</div>
      <div class="title">城市第六器官 · 环卫智能体</div>
      <div class="desc">业主要求远程汇报建设思路 · 有亮点 · 不局限于传统智慧化</div>
    </div>
    <div class="crisis-wrap">
      <div class="crisis-box">
        <div class="time">22:00</div>
        <div class="label">今晚</div>
      </div>
      <div class="crisis-arrow">→</div>
      <div class="crisis-box">
        <div class="time">10:00</div>
        <div class="label">明天上午</div>
      </div>
    </div>
    <div class="anxiety-bar">
      <div class="bar-label">ANXIETY INDEX</div>
      <div class="bar"><div class="bar-fill"></div></div>
    </div>
  </div>
  <div class="hud-bot">
    <span>[12:00] 累计</span>
    <span>焦虑指数拉满 · PPT 还没做</span>
  </div>
</div>
</body>
</html>
