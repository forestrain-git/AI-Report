<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P21 · 团队的另一面</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    padding: 100px 140px 80px;
    background: var(--bg);
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .kicker { margin-bottom: 20px; }
  h1 {
    font-size: 56px;
    font-weight: 900;
    margin: 0 0 48px 0;
  }
  .context {
    font-size: 24px;
    line-height: 1.8;
    color: var(--muted);
    margin-bottom: 48px;
  }
  .context strong {
    color: var(--primary);
  }
  .case-card {
    padding: 40px;
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 2px 12px rgba(15,23,42,0.04);
    margin-bottom: 40px;
  }
  .case-title {
    font-size: 28px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 20px;
  }
  .case-body {
    font-size: 22px;
    line-height: 1.8;
    color: var(--ink);
  }
  .case-body strong {
    color: var(--primary);
  }
  .compare {
    display: flex;
    gap: 24px;
    margin-bottom: 32px;
  }
  .compare-item {
    flex: 1;
    padding: 24px;
    background: var(--primary-light);
    border-radius: 4px;
    text-align: center;
  }
  .compare-label {
    font-size: 18px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .compare-value {
    font-size: 36px;
    font-weight: 700;
    color: var(--primary);
  }
  .link-row {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .link-row a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    border-radius: 4px;
    font-size: 18px;
    font-weight: 600;
  }
  .link-row a:hover { background: #2a4a73; }
</style>
</head>
<body>
  <div class="top-bar"></div>
  <div class="content">
    <div class="kicker">Stage 3 &middot; 团队的另一面</div>
    <h1>我翻车，他们在前进</h1>
    <div class="context">
      龙虾这条线，我个人是翻车了。但<strong>团队在其他领域是有成效的</strong>——整个团队，是在同步成长的。
    </div>
    <div class="case-card">
      <div class="case-title">管理学院项目</div>
      <div class="case-body">
        跟一家内部单位谈了一个小项目。僵持中，研发回我说<strong>已经快做完了</strong>。
        <div class="compare">
          <div class="compare-item">
            <div class="compare-label">传统流程</div>
            <div class="compare-value">至少 2 周</div>
          </div>
          <div class="compare-item">
            <div class="compare-label">AI 辅助</div>
            <div class="compare-value">3 天原型 + 1 周交付</div>
          </div>
        </div>
        业主一看——<strong>「你们这不是已经做完了吗？」</strong>——立即推动合同签订，已完成评审，正在走用印流程。
      </div>
    </div>
    <div class="link-row">
      <a href="https://arc.csceccloud.net:8443/" target="_blank">&#x2197; 查看真实系统</a>
    </div>
  </div>
  <div class="page-footer">
    <span class="section-name">阶段三：龙虾依赖期</span>
    <span class="page-num">21 / 39</span>
  </div>
</body>
</html>
