<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P17 · 三省六部制</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    padding: 100px 140px 80px;
    background: var(--bg);
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .kicker { margin-bottom: 20px; }
  h1 {
    font-size: 56px;
    font-weight: 900;
    margin: 0 0 40px 0;
  }
  .org-chart {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 40px;
  }
  .org-row {
    display: flex;
    gap: 16px;
  }
  .org-row.top {
    justify-content: center;
  }
  .org-box {
    flex: 1;
    padding: 20px 24px;
    background: #fff;
    border-radius: 4px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(15,23,42,0.03);
  }
  .org-box.leader {
    background: var(--primary);
    color: #fff;
    max-width: 400px;
  }
  .org-name {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .org-role {
    font-size: 16px;
    opacity: 0.75;
  }
  .divider {
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 0.2em;
    margin: 4px 0;
  }
  .example {
    padding: 28px 36px;
    background: var(--primary-light);
    border-radius: 4px;
    font-size: 22px;
    line-height: 1.7;
    color: var(--ink);
  }
  .example strong {
    color: var(--primary);
  }
</style>
</head>
<body>
  <div class="top-bar"></div>
  <div class="content">
    <div class="kicker">Stage 3 &middot; 解决方案</div>
    <h1>三省六部制——各司其职</h1>
    <div class="org-chart">
      <div class="org-row top">
        <div class="org-box leader">
          <div class="org-name">客户（上帝）</div>
          <div class="org-role">派活、验收、说了算</div>
        </div>
      </div>
      <div class="org-row top">
        <div class="org-box leader" style="background: var(--accent); color: #1a2332;">
          <div class="org-name">龙虾（皇帝）</div>
          <div class="org-role">服务客户，统筹三省六部</div>
        </div>
      </div>
      <div class="divider">三省</div>
      <div class="org-row">
        <div class="org-box">
          <div class="org-name">中书省</div>
          <div class="org-role">起草——需求转方案初稿</div>
        </div>
        <div class="org-box">
          <div class="org-name">门下省</div>
          <div class="org-role">审议——逻辑、合规、自洽</div>
        </div>
        <div class="org-box">
          <div class="org-name">尚书省</div>
          <div class="org-role">执行——统筹调度、派任务</div>
        </div>
      </div>
      <div class="divider">六部</div>
      <div class="org-row">
        <div class="org-box"><div class="org-name">吏部</div><div class="org-role">调用子龙虾/模型</div></div>
        <div class="org-box"><div class="org-name">户部</div><div class="org-role">资料、成本测算</div></div>
        <div class="org-box"><div class="org-name">礼部</div><div class="org-role">对外行文、文档</div></div>
        <div class="org-box"><div class="org-name">兵部</div><div class="org-role">资源调度</div></div>
        <div class="org-box"><div class="org-name">刑部</div><div class="org-role">验证、测试、纠错</div></div>
        <div class="org-box"><div class="org-name">工部</div><div class="org-role">写代码、出图、出方案</div></div>
      </div>
    </div>
    <div class="example">
      各司其职，<strong>短期记忆压力分摊到每个子部门头上</strong>，主龙虾只管协调，不管实操。
    </div>
  </div>
  <div class="page-footer">
    <span class="section-name">阶段三：龙虾依赖期</span>
    <span class="page-num">17 / 39</span>
  </div>
</body>
</html>
