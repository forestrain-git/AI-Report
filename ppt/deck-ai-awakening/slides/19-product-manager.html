<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P19 · 老产品经理救场</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    padding: 100px 140px 80px;
    background: var(--bg);
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .kicker { margin-bottom: 20px; }
  h1 {
    font-size: 64px;
    font-weight: 900;
    margin: 0 0 40px 0;
  }
  .split-row {
    display: flex;
    gap: 48px;
    margin-bottom: 40px;
    align-items: flex-start;
  }
  .left-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .right-col {
    flex: 1.4;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .story {
    font-size: 24px;
    line-height: 1.6;
    color: var(--ink);
  }
  .story strong {
    color: var(--primary);
  }
  .backup-badge {
    padding: 16px 40px;
    background: var(--primary);
    color: #fff;
    border-radius: 4px;
    font-size: 22px;
    font-weight: 600;
    text-align: center;
  }
  .conclusion {
    font-size: 28px;
    font-weight: 700;
    color: var(--primary);
    line-height: 1.6;
  }
  .deliverables-img {
    width: 100%;
    height: auto;
    max-height: 780px;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 4px 24px rgba(15,23,42,0.12);
  }
</style>

<body>
  <div class="top-bar"></div>
  <div class="content">
    <div class="kicker">Stage 3 &middot; 救场</div>
    <h1>老产品经理救场</h1>
    <div class="split-row">
      <div class="left-col">
        <div class="story">
          明天就要交了，今晚十点，龙虾<strong>再一次</strong>把整个项目完整重构后，<strong>我崩溃了。</strong><br><br>
          我留了一手——安排了一位老产品经理，<strong>绝不碰龙虾，手搓方案</strong>，作为兜底的备份。<br><br>
          那天晚上，把勉强能用的资料拼一拼交给他：<strong>「明天务必出一版！」</strong><br><br>
          老产品经理没掉链子——用最朴实的办法，<strong>手搓到凌晨</strong>。<br>
          第二天，方案如期交出去，<strong>业主没有提出异议</strong>。
        </div>
        <div class="backup-badge">救我的不是龙虾，是那个我留的「手搓兜底」</div>
        <div class="conclusion">这一关，算暂时过去了。</div>
      </div>
      <div class="right-col">
        <img class="deliverables-img" src="../assets/feishu-deliverables.png" alt="最终交付成果截图">
      </div>
    </div>
  </div>
  <div class="page-footer">
    <span class="section-name">阶段三：龙虾依赖期</span>
    <span class="page-num">19 / 39</span>
  </div>
