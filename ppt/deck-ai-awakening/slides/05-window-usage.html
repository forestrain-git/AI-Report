<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P5 · 我的使用方式</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    padding: 100px 140px 80px;
    background: var(--bg);
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .kicker { margin-bottom: 20px; }
  h1 {
    font-size: 64px;
    font-weight: 900;
    margin: 0 0 56px 0;
  }
  .flow {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 56px;
  }
  .flow-step {
    flex: 1;
    padding: 32px;
    background: #fff;
    border-radius: 4px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(15,23,42,0.03);
    font-size: 24px;
    line-height: 1.5;
  }
  .flow-step strong {
    display: block;
    font-size: 28px;
    color: var(--primary);
    margin-bottom: 8px;
  }
  .flow-arrow {
    font-family: "Inter", sans-serif;
    font-size: 32px;
    color: var(--primary);
    font-weight: 300;
  }
  .insight {
    font-size: 32px;
    line-height: 1.7;
    color: var(--ink);
    padding: 36px 40px;
    background: var(--primary-light);
    border-radius: 4px;
    border-left: 4px solid var(--primary);
  }
  .insight strong {
    color: var(--primary);
  }
</style>
</head>
<body>
  <div class="top-bar"></div>
  <div class="content">
    <div class="kicker">Stage 1 &middot; 窗口依赖期</div>
    <h1>两个月之前，我怎么用 AI</h1>
    <div class="flow">
      <div class="flow-step">
        <strong>打开网页</strong>
        豆包、DeepSeek、Kimi...
      </div>
      <div class="flow-arrow">&rarr;</div>
      <div class="flow-step">
        <strong>提个问题</strong>
        或者上传 PDF 做摘要
      </div>
      <div class="flow-arrow">&rarr;</div>
      <div class="flow-step">
        <strong>复制粘贴</strong>
        到 Word 里
      </div>
      <div class="flow-arrow">&rarr;</div>
      <div class="flow-step">
        <strong>关掉</strong>
        对话结束
      </div>
    </div>
    <div class="insight">
      每一次对话，都是孤立的。每一次对话，都是一次性的。<br>
      那时候我对 AI 的认知——<strong>就是一个加强版的百度</strong>。百度出来的是链接，AI 出来的是答案。仅此而已。
    </div>
  </div>
  <div class="page-footer">
    <span class="section-name">阶段一：窗口依赖期</span>
    <span class="page-num">05 / 39</span>
  </div>
</body>
</html>
