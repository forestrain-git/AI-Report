<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P25 · 从零基础到方案落地</title>

<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    padding: 100px 140px 80px;
    background: var(--bg);
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .kicker { margin-bottom: 20px; }
  h1 {
    font-size: 56px;
    font-weight: 900;
    margin: 0 0 48px 0;
  }
  .story {
    font-size: 24px;
    line-height: 1.8;
    color: var(--ink);
    margin-bottom: 48px;
  }
  .story strong {
    color: var(--primary);
  }
  .steps {
    display: flex;
    gap: 16px;
  }
  .step {
    flex: 1;
    padding: 28px;

<body>
  <div class="top-bar"></div>
  <div class="content">
    <div class="kicker">Stage 4 &middot; 深入</div>
    <h1>从零基础到方案落地</h1>
    <div class="story">
      在大厂朋友的强烈建议下，用上了 <strong>Claude Code</strong>——DOS 时代的过来人，上手就用的 CLI 终端。
      安装过程其实也挺麻烦的，但这个时候已经进化了：安排小龙虾帮忙安装，等了一会，就装好了。
      <br><br>
      刚开始用也没觉得多惊艳，只是好像干活更有章法了、更聪明了、Bug 出得更少了。
      但真正让我惊艳的，是 <strong>Karpathy 的 LLM+Wiki 构想的落地</strong>。
    </div>
    <div class="steps">
      <div class="step">
        <div class="step-num">01</div>
        <div class="step-text">用上 Claude Code<br>CLI 终端直连</div>
      </div>
      <div class="step">
        <div class="step-num">02</div>
        <div class="step-text">感觉更有章法<br>Bug 更少</div>
      </div>
      <div class="step">
        <div class="step-num">03</div>
        <div class="step-text">真正惊艳的是<br>LLM+Wiki 落地</div>
      </div>
    </div>
  </div>
  <div class="page-footer">
    <span class="section-name">阶段四：CC 依赖期</span>
    <span class="page-num">25 / 39</span>
  </div>
