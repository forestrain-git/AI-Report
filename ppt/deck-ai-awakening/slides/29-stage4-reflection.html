<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P31 · 阶段四反思</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: var(--dark-bg);
    color: var(--dark-ink);
    padding: 0 200px;
  }
  .content {
    position: relative;
    z-index: 2;
    max-width: 1100px;
  }
  .kicker {
    color: var(--accent);
    margin-bottom: 36px;
  }
  h1 {
    font-size: 56px;
    font-weight: 900;
    margin: 0 0 48px 0;
  }
  .formula {
    font-size: 40px;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 48px;
  }
  .formula .accent {
    color: var(--accent);
  }
  .dilemma {
    display: flex;
    gap: 32px;
    margin-bottom: 48px;
  }
  .dilemma-card {
    flex: 1;
    padding: 28px;
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    text-align: center;
  }
  .dilemma-label {
    font-size: 20px;
    color: var(--dark-muted);
    margin-bottom: 12px;
  }
  .dilemma-text {
    font-size: 24px;
    font-weight: 700;
    line-height: 1.5;
  }
  .rule {
    padding: 28px 48px;
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 4px;
    font-size: 28px;
    font-weight: 700;
  }
  .page-num {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    font-family: "Inter", sans-serif;
    font-size: 14px;
    color: var(--dark-muted);
    letter-spacing: 0.15em;
  }
</style>
</head>
<body>
  <div class="content">
    <div class="kicker">Stage 4 &middot; 第三课 &amp; 第四课</div>
    <h1>阶段四反思</h1>
    <div class="formula">
      你的领域知识 <span class="accent">&times;</span> AI 的执行力 <span class="accent">=</span> 你的超能力
    </div>
    <div class="dilemma">
      <div class="dilemma-card">
        <div class="dilemma-label">有知识、没 AI</div>
        <div class="dilemma-text">效率瓶颈<br>知识能沉淀，但变不成产品</div>
      </div>
      <div class="dilemma-card">
        <div class="dilemma-label">有 AI、没知识</div>
        <div class="dilemma-text">速度快，但质量不可控<br>错误也被同步放大</div>
      </div>
    </div>
    <div class="rule">AI 出方案，人做决策；AI 给建议，人签字。<br>AI 是参谋，不是司令。</div>
  </div>
  <div class="page-num">31 / 39</div>
</body>
</html>
