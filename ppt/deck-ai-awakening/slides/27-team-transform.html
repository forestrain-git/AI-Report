<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P29 · 团队全面转型</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    padding: 100px 140px 80px;
    background: var(--bg);
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .kicker { margin-bottom: 20px; }
  h1 {
    font-size: 56px;
    font-weight: 900;
    margin: 0 0 40px 0;
  }
  .goal {
    padding: 28px 40px;
    background: var(--primary);
    color: #fff;
    border-radius: 4px;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 40px;
    text-align: center;
  }
  .cases {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .case {
    padding: 28px 36px;
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(15,23,42,0.03);
  }
  .case-title {
    font-size: 24px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 8px;
  }
  .case-desc {
    font-size: 20px;
    line-height: 1.6;
    color: var(--ink);
  }
  .case-desc strong {
    color: var(--primary);
  }
  .link-row {
    margin-top: 8px;
  }
  .link-row a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    border-radius: 4px;
    font-size: 16px;
    font-weight: 600;
  }
  .conclusion {
    margin-top: 32px;
    font-size: 28px;
    font-weight: 700;
    color: var(--primary);
    text-align: center;

<body>
  <div class="top-bar"></div>
  <div class="content">
    <div class="kicker">Stage 4 &middot; 全面转型</div>
    <h1>逼迫团队，全部转型</h1>
    <div class="goal">让团队每个人都成为全栈——一个人搞定售前、产品、研发、测试、交付</div>
    <div class="cases">
      <div class="case">
        <div class="case-title">招标系统</div>

          一个研发，全程 CC，从零搭骨架到能上线给客户看，<strong>半天</strong>。没有外包、没有美工，全是 AI 顶上去。
          <div class="link-row">
            <a href="https://bid.csceccloud.net:8443/#/dashboard" target="_blank">&#x2197; 查看系统</a>
          </div>
        </div>
      </div>
      <div class="case">
        <div class="case-title">江阴项目</div>
        <div class="case-desc">一个原本快做不下去的项目，<strong>靠 AI 重新拉回来</strong>。</div>
      </div>
      <div class="case">
        <div class="case-title">内部档案管理项目</div>
        <div class="case-desc">客户很满意，已开展后续合作讨论。基本都是一个研发人员完成的，真正的「全栈」。</div>
      </div>
    </div>
    <div class="conclusion">让中建智能向一家 AI 公司转型——这不是口号，是正在发生的事实。</div>
  </div>
  <div class="page-footer">
    <span class="section-name">阶段四：CC 依赖期</span>

  </div>
