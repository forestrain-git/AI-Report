<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P16 龙虾的双面性</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a1628; font-family: var(--font-body); color: var(--ink-primary); }
  .slide { width: 100%; height: 100%; position: relative; padding: 80px 120px; display: flex; flex-direction: column; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
  .frame { position: absolute; inset: 48px; border: 1px solid rgba(74,144,217,0.12); pointer-events: none; }
  .corner { position: absolute; width: 20px; height: 20px; border: 2px solid rgba(201,169,97,0.4); }
  .corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .corner.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  .hud-top { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: rgba(74,144,217,0.4); letter-spacing: 0.08em; margin-bottom: 48px; z-index: 1; }
  .header { margin-bottom: 48px; z-index: 1; }
  .header h1 { font-family: var(--font-display); font-size: 72px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-primary); margin-bottom: 16px; }
  .header .underline { width: 60px; height: 4px; background: #C9A961; box-shadow: 0 0 12px rgba(201,169,97,0.3); }

  .body { flex: 1; display: flex; gap: 48px; z-index: 1; }
  .side { flex: 1; padding: 40px; border: 1px solid rgba(74,144,217,0.15); }
  .side.good { border-color: rgba(201,169,97,0.2); background: rgba(201,169,97,0.03); }
  .side.bad { border-color: rgba(220,80,60,0.15); background: rgba(220,80,60,0.02); }
  .side .label { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.15em; margin-bottom: 24px; }
  .side.good .label { color: rgba(201,169,97,0.6); }
  .side.bad .label { color: rgba(220,80,60,0.5); }
  .side .title { font-size: 32px; font-weight: 600; color: var(--ink-primary); margin-bottom: 24px; }
  .side .item { font-size: 20px; color: var(--ink-secondary); line-height: 1.8; margin-bottom: 16px; padding-left: 24px; position: relative; }
  .side .item::before { content: ''; position: absolute; left: 0; top: 12px; width: 8px; height: 8px; border-radius: 50%; }
  .side.good .item::before { background: #C9A961; }
  .side.bad .item::before { background: rgba(220,80,60,0.6); }
  .summary { text-align: center; margin-top: 32px; font-size: 24px; color: var(--ink-primary); letter-spacing: 0.05em; }
  .summary strong { color: #C9A961; }
  .hud-bot { display: flex; justify-content: space-between; font-size: 12px; color: rgba(232,232,232,0.25); letter-spacing: 0.08em; margin-top: 24px; z-index: 1; }
  .hud-bot span { color: rgba(201,169,97,0.5); }
</style>
</head>
<body>
<div class="slide">
  <div class="grid"></div>
  <div class="frame">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div class="hud-top">
    <span>PART 1 · 阶段三</span>
    <span class="badge" style="border:1px solid rgba(201,169,97,0.25);padding:3px 12px;color:rgba(201,169,97,0.55);background:rgba(201,169,97,0.04)">双面性</span>
    <span>16 / 39</span>
  </div>
  <div class="header">
    <h1>龙虾的双面性</h1>
    <div class="underline"></div>
  </div>
  <div class="body">
    <div class="side good">
      <div class="label">IMPRESSION 01 · 惊艳</div>
      <div class="title">像是真有一个灵魂在干活</div>
      <div class="item">飞书里直接操作，多龙虾能商量沟通</div>
      <div class="item">给一个目标，它们真的会相互讨论想办法</div>
      <div class="item">出活快，形式新颖（md + 富文本）</div>
      <div class="item">关键文件叫 soul.md —— 灵魂文件</div>
    </div>
    <div class="side bad">
      <div class="label">IMPRESSION 02 · 惊吓</div>
      <div class="title">反复失忆 · 幻觉严重</div>
      <div class="item">今天教过的东西，明天又忘了</div>
      <div class="item">信誓旦旦给你一个完全错误的结论</div>
      <div class="item">十次里有三次好，七次要返工</div>
      <div class="item">你说改 A，它顺手把 B 也改了</div>
    </div>
  </div>
  <div class="summary">AI 自动化能力越强，<strong>失控的风险也越大</strong></div>
  <div class="hud-bot">
    <span>[22:30] 累计</span>
    <span>从惊艳到惊吓 · 龙虾真相</span>
  </div>
</div>
</body>
</html>
