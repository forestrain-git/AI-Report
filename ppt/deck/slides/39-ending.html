<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P39 总结与自由交流</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #FAFBFC; font-family: var(--font-body); color: var(--ink-primary); }
  .slide { width: 100%; height: 100%; position: relative; padding: 80px 120px; display: flex; flex-direction: column; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
  .frame { position: absolute; inset: 48px; border: 1px solid rgba(37,99,235,0.12); pointer-events: none; }
  .corner { position: absolute; width: 20px; height: 20px; border: 2px solid rgba(30,58,95,0.4); }
  .corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .corner.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  .hud-top { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: rgba(30,58,95,0.6); letter-spacing: 0.08em; margin-bottom: 48px; z-index: 1; }
  .header { margin-bottom: 48px; z-index: 1; }
  .header h1 { font-family: var(--font-display); font-size: 72px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-primary); margin-bottom: 16px; }
  .header .underline { width: 60px; height: 4px; background: #1E3A5F; box-shadow: 0 0 12px rgba(30,58,95,0.3); }

  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; z-index: 1; }
  .formula-box { text-align: center; padding: 40px 80px; border: 2px solid rgba(30,58,95,0.3); background: rgba(30,58,95,0.08); margin-bottom: 40px; }
  .formula-box .formula { font-family: var(--font-display); font-size: 42px; font-weight: 700; color: #1E3A5F; letter-spacing: 0.05em; }
  .formula-box .formula .dim { color: rgba(15,23,42,0.3); }
  .points { display: flex; flex-direction: column; gap: 16px; margin-bottom: 40px; }
  .point { text-align: center; font-size: 22px; color: var(--ink-secondary); }
  .point strong { color: var(--ink-primary); }
  .end { text-align: center; padding: 40px; border: 1px solid rgba(30,58,95,0.2); }
  .end .label { font-family: var(--font-mono); font-size: 14px; color: rgba(30,58,95,0.5); letter-spacing: 0.2em; margin-bottom: 16px; }
  .end .text { font-size: 32px; font-weight: 600; color: #1E3A5F; }
  .end .sub { font-size: 18px; color: var(--ink-tertiary); margin-top: 12px; }
  .hud-bot { display: flex; justify-content: space-between; font-size: 12px; color: rgba(15,23,42,0.5); letter-spacing: 0.08em; margin-top: 24px; z-index: 1; }
  .hud-bot span { color: rgba(30,58,95,0.5); }
</style>
</head>
<body>
<div class="slide">
  <div class="grid"></div>
  <div class="frame">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div class="hud-top">
    <span>收尾</span>
    <span class="badge" style="border:1px solid rgba(30,58,95,0.4);padding:3px 12px;color:rgba(30,58,95,0.8);background:rgba(30,58,95,0.04)">总结</span>
    <span>39 / 39</span>
  </div>
  <div class="header">
    <h1>总结与行动</h1>
    <div class="underline"></div>
  </div>
  <div class="body">
    <div class="formula-box">
      <div class="formula">AI 价值 <span class="dim">=</span> 专业知识 <span class="dim">×</span> AI 工具能力</div>
    </div>
    <div class="points">
      <div class="point">两个月的真实经历，供大家参考 —— <strong>不必重复同样的弯路</strong></div>
      <div class="point">AI 不会替代人，但 <strong>会用 AI 的人会替代不会用的人</strong></div>
      <div class="point">专业能力和行业经验，仍然是 <strong>核心资产</strong></div>
      <div class="point">限制能力的，往往不是技术，而是 <strong>想象力</strong></div>
    </div>
    <div class="starter-pack" style="display:flex;gap:24px;margin-bottom:32px;">
      <div style="flex:1;padding:24px 32px;border:1px solid rgba(30,58,95,0.2);background:rgba(30,58,95,0.04);">
        <div style="font-family:var(--font-mono);font-size:12px;color:rgba(30,58,95,0.6);letter-spacing:0.15em;margin-bottom:12px;">TOOL LINKS</div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <a href="https://www.anthropic.com/claude-code" style="color:#1E3A5F;text-decoration:none;font-size:16px;border-bottom:1px solid rgba(30,58,95,0.15);padding-bottom:4px;">Claude Code + Obsidian 入门</a>
          <a href="https://kimi.moonshot.cn" style="color:#1E3A5F;text-decoration:none;font-size:16px;border-bottom:1px solid rgba(30,58,95,0.15);padding-bottom:4px;">Kimi · 深度研究</a>
          <a href="https://www.doubao.com" style="color:#1E3A5F;text-decoration:none;font-size:16px;border-bottom:1px solid rgba(30,58,95,0.15);padding-bottom:4px;">豆包 · 窗口工具</a>
        </div>
      </div>
      <div style="flex:1;padding:24px 32px;border:1px solid rgba(30,58,95,0.2);background:rgba(30,58,95,0.04);">
        <div style="font-family:var(--font-mono);font-size:12px;color:rgba(30,58,95,0.6);letter-spacing:0.15em;margin-bottom:12px;">PROMPT TEMPLATES</div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <div style="color:var(--ink-primary);font-size:16px;">PPT 生成提示词模板</div>
          <div style="color:var(--ink-primary);font-size:16px;">深度研究任务拆解模板</div>
        </div>
      </div>
    </div>
    <div class="end">
      <div class="label">FREE EXCHANGE</div>
      <div class="text">自由交流</div>
      <div class="sub">欢迎提问和分享 · 找最好的，立刻用</div>
    </div>
  </div>
  <div class="hud-bot">
    <span>[70:00] 累计</span>
    <span>演讲结束 · 感谢聆听</span>
  </div>
</div>
</body>
</html>
