<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>封面 H · 瑞士几何</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: #0D1117;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    color: #0F172A;
  }
  .slide {
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    position: relative;
  }
  /* 严格的网格线 */
  .slide::before {
    content: '';
    position: absolute;
    inset: 80px;
    border: 2px solid #1E3A5F;
    pointer-events: none;
    z-index: 10;
  }
  .slide::after {
    content: '';
    position: absolute;
    top: 80px; bottom: 80px;
    left: 50%;
    width: 2px;
    background: #1E3A5F;
    pointer-events: none;
    z-index: 10;
  }
  .h-line {
    position: absolute;
    top: 50%;
    left: 80px; right: 80px;
    height: 2px;
    background: #1E3A5F;
    pointer-events: none;
    z-index: 10;
  }

  /* 左上：大色块 */
  .block-tl {
    grid-column: 1; grid-row: 1;
    background: #1E3A5F;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 100px 80px 80px 100px;
  }
  .block-tl .label {
    font-size: 14px;
    color: rgba(13,17,23,0.6);
    letter-spacing: 0.2em;
    margin-bottom: 24px;
    font-family: "SF Mono", monospace;
  }
  .block-tl .big-num {
    font-family: "Noto Sans SC", sans-serif;
    font-size: 160px;
    font-weight: 700;
    color: #0D1117;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  /* 右上：标题 */
  .block-tr {
    grid-column: 2; grid-row: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 100px 100px 80px 80px;
  }
  .block-tr h1 {
    font-family: "Noto Sans SC", sans-serif;
    font-size: 72px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: 0.04em;
    color: #0F172A;
  }
  .block-tr h1 .gold { color: #1E3A5F; }

  /* 左下：副标题 */
  .block-bl {
    grid-column: 1; grid-row: 2;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 80px 80px 100px 100px;
  }
  .block-bl .sub {
    font-family: "Noto Sans SC", sans-serif;
    font-size: 28px;
    color: rgba(15,23,42,0.55);
    letter-spacing: 0.1em;
    line-height: 1.6;
  }
  .block-bl .line {
    width: 60px;
    height: 4px;
    background: #1E3A5F;
    margin-top: 40px;
  }

  /* 右下：公司名 */
  .block-br {
    grid-column: 2; grid-row: 2;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: flex-start;
    padding: 80px 100px 100px 80px;
  }
  .block-br .co {
    font-size: 16px;
    color: rgba(15,23,42,0.35);
    letter-spacing: 0.2em;
    line-height: 2;
  }
  .block-br .date {
    margin-top: auto;
    font-family: "SF Mono", monospace;
    font-size: 13px;
    color: rgba(15,23,42,0.5);
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="h-line"></div>

  <div class="block-tl">
    <div class="label">PRESENTATION</div>
    <div class="big-num">01</div>
  </div>

  <div class="block-tr">
    <h1>AI <span class="gold">觉醒</span><br>经历分享</h1>
  </div>

  <div class="block-bl">
    <p class="sub">一个老程序员<br>两个月的记录</p>
    <div class="line"></div>
  </div>

  <div class="block-br">
    <div class="co">中建智能技术有限公司</div>
    <div class="date">2026.05 / BEIJING</div>
  </div>
</div>
</body>
</html>
