
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P14 阶段三封面</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a1628; font-family: var(--font-body); color: var(--ink-primary); }
  .slide { width: 100%; height: 100%; position: relative; padding: 80px 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
  .frame { position: absolute; inset: 48px; border: 1px solid rgba(74,144,217,0.12); pointer-events: none; }
  .corner { position: absolute; width: 20px; height: 20px; border: 2px solid rgba(201,169,97,0.4); }
  .corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .corner.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  .stage-label { font-family: var(--font-mono); font-size: 14px; color: rgba(201,169,97,0.5); letter-spacing: 0.3em; margin-bottom: 32px; z-index: 1; }
  .title { font-family: var(--font-display); font-size: 88px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-primary); text-align: center; margin-bottom: 24px; z-index: 1; line-height: 1.2; }
  .title .gold { color: #C9A961; }
  .divider { width: 80px; height: 3px; background: #C9A961; box-shadow: 0 0 16px rgba(201,169,97,0.4); margin-bottom: 32px; z-index: 1; }
  .subtitle { font-family: var(--font-display); font-size: 28px; color: var(--ink-secondary); letter-spacing: 0.1em; z-index: 1; }
  .mood { margin-top: 48px; padding: 16px 40px; border: 1px solid rgba(74,144,217,0.2); font-size: 18px; color: rgba(74,144,217,0.6); letter-spacing: 0.1em; z-index: 1; }
  .hud-bot { position: absolute; bottom: 56px; left: 120px; right: 120px; display: flex; justify-content: space-between; font-size: 12px; color: rgba(232,232,232,0.25); letter-spacing: 0.08em; z-index: 1; }
  .hud-bot span { color: rgba(201,169,97,0.5); }
</style>
</head>
<body>
<div class="slide">
  <div class="grid"></div>
  <div class="frame">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div class="stage-label">STAGE 03 · 扬 → 抑</div>
  <h1 class="title">牛吹大了，<br>我<span class="gold">睡不着觉</span></h1>
  <div class="divider"></div>
  <p class="subtitle">3 月下半月 · 完全不懂的业态，怎么做可研？</p>
  <div class="mood">MOOD: ANXIOUS · PRESSURE TEST</div>
  <div class="hud-bot">
    <span>P14 / 39</span>
    <span>[20:00] 累计 · 阶段三开始</span>
  </div>
</div>
</body>
</html>
