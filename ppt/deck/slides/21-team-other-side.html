
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P21 团队的另一面</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a1628; font-family: var(--font-body); color: var(--ink-primary); }
  .slide { width: 100%; height: 100%; position: relative; padding: 80px 120px; display: flex; flex-direction: column; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
  .frame { position: absolute; inset: 48px; border: 1px solid rgba(74,144,217,0.12); pointer-events: none; }
  .corner { position: absolute; width: 20px; height: 20px; border: 2px solid rgba(201,169,97,0.4); }
  .corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .corner.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  .hud-top { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: rgba(74,144,217,0.4); letter-spacing: 0.08em; margin-bottom: 48px; z-index: 1; }
  .header { margin-bottom: 48px; z-index: 1; }
  .header h1 { font-family: var(--font-display); font-size: 72px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-primary); margin-bottom: 16px; }
  .header .underline { width: 60px; height: 4px; background: #C9A961; box-shadow: 0 0 12px rgba(201,169,97,0.3); }

  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; z-index: 1; }
  .context { text-align: center; font-size: 24px; color: var(--ink-secondary); margin-bottom: 40px; }
  .context strong { color: var(--ink-primary); }
  .project-show { display: flex; gap: 48px; align-items: stretch; margin-bottom: 40px; }
  .show-left { flex: 1; padding: 40px; border: 1px solid rgba(201,169,97,0.2); background: rgba(201,169,97,0.04); }
  .show-left .name { font-size: 28px; font-weight: 600; color: var(--ink-primary); margin-bottom: 16px; }
  .show-left .detail { font-size: 18px; color: var(--ink-secondary); line-height: 1.8; }
  .show-left .detail strong { color: #C9A961; }
  .show-right { width: 300px; display: flex; flex-direction: column; gap: 16px; }
  .stat-box { flex: 1; padding: 24px; border: 1px solid rgba(74,144,217,0.15); text-align: center; display: flex; flex-direction: column; justify-content: center; }
  .stat-box .num { font-family: var(--font-display); font-size: 36px; font-weight: 700; color: #C9A961; }
  .stat-box .label { font-size: 14px; color: var(--ink-tertiary); margin-top: 4px; }
  .link-box { text-align: center; }
  .link-box a { display: inline-block; padding: 14px 40px; border: 1px solid rgba(201,169,97,0.4); color: #C9A961; font-size: 16px; letter-spacing: 0.1em; text-decoration: none; font-family: var(--font-mono); background: rgba(201,169,97,0.05); }
  .conclusion { text-align: center; font-size: 24px; color: var(--ink-secondary); }
  .conclusion strong { color: #C9A961; }
  .hud-bot { display: flex; justify-content: space-between; font-size: 12px; color: rgba(232,232,232,0.25); letter-spacing: 0.08em; margin-top: 24px; z-index: 1; }
  .hud-bot span { color: rgba(201,169,97,0.5); }
</style>
</head>
<body>
<div class="slide">
  <div class="grid"></div>
  <div class="frame">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div class="hud-top">
    <span>PART 1 · 阶段三</span>
    <span class="badge" style="border:1px solid rgba(201,169,97,0.25);padding:3px 12px;color:rgba(201,169,97,0.55);background:rgba(201,169,97,0.04)">团队成果</span>
    <span>21 / 39</span>
  </div>
  <div class="header">
    <h1>团队的另一面</h1>
    <div class="underline"></div>
  </div>
  <div class="body">
    <div class="context">我龙虾这条线翻了车，但<strong>团队在另外几条线上已有实打实的产出</strong></div>
    <div class="project-show">
      <div class="show-left">
        <div class="name">管理学院项目</div>
        <div class="detail">
          传统开发 <strong>2 周</strong><br>
          AI 辅助：<strong>3 天出原型 · 1 周交付可用版本</strong><br>
          业主："你们这不是已经做完了吗？" → 推动合同签订
        </div>
      </div>
      <div class="show-right">
        <div class="stat-box"><div class="num">3 天</div><div class="label">出原型</div></div>
        <div class="stat-box"><div class="num">1 周</div><div class="label">交付</div></div>
      </div>
    </div>
    <div class="link-box">
      <a href="https://arc.csceccloud.net:8443/" target="_blank">> 现场打开系统演示</a>
    </div>
    <div class="conclusion" style="margin-top:32px">
      整个团队，<strong>是在同步成长的</strong>
    </div>
  </div>
  <div class="hud-bot">
    <span>[31:30] 累计</span>
    <span>ROI 量化 · 团队同步成长</span>
  </div>
</div>
</body>
</html>
