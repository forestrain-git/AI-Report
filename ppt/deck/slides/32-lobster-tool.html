<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P32 龙虾</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #FAFBFC; font-family: var(--font-body); color: var(--ink-primary); }
  .slide { width: 100%; height: 100%; position: relative; padding: 80px 120px; display: flex; flex-direction: column; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
  .frame { position: absolute; inset: 48px; border: 1px solid rgba(37,99,235,0.12); pointer-events: none; }
  .corner { position: absolute; width: 20px; height: 20px; border: 2px solid rgba(30,58,95,0.4); }
  .corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .corner.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  .hud-top { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: rgba(30,58,95,0.6); letter-spacing: 0.08em; margin-bottom: 48px; z-index: 1; }
  .header { margin-bottom: 48px; z-index: 1; }
  .header h1 { font-family: var(--font-display); font-size: 72px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-primary); margin-bottom: 16px; }
  .header .underline { width: 60px; height: 4px; background: #1E3A5F; box-shadow: 0 0 12px rgba(30,58,95,0.3); }

  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; z-index: 1; }
  .hero { text-align: center; margin-bottom: 48px; }
  .hero .label { font-family: var(--font-mono); font-size: 14px; color: rgba(37,99,235,0.5); letter-spacing: 0.2em; margin-bottom: 16px; }
  .hero .title { font-size: 48px; font-weight: 700; color: var(--ink-primary); }
  .hero .title span { color: #1E3A5F; }
  .features { display: flex; gap: 32px; margin-bottom: 48px; justify-content: center; }
  .feat { flex: 1; max-width: 320px; padding: 32px; border: 1px solid rgba(37,99,235,0.15); text-align: center; }
  .feat .icon { font-size: 36px; margin-bottom: 16px; }
  .feat .text { font-size: 18px; color: var(--ink-primary); }
  .warning { text-align: center; padding: 32px 60px; border: 1px solid rgba(220,80,60,0.15); background: rgba(220,80,60,0.02); }
  .warning .label { font-family: var(--font-mono); font-size: 12px; color: rgba(220,80,60,0.5); letter-spacing: 0.15em; margin-bottom: 12px; }
  .warning .text { font-size: 22px; color: var(--ink-primary); }
  .warning .text strong { color: #1E3A5F; }
  .hud-bot { display: flex; justify-content: space-between; font-size: 12px; color: rgba(15,23,42,0.5); letter-spacing: 0.08em; margin-top: 24px; z-index: 1; }
  .hud-bot span { color: rgba(30,58,95,0.5); }
</style>
</head>
<body>
<div class="slide">
  <div class="grid"></div>
  <div class="frame">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div class="hud-top">
    <span>PART 2 · 工具矩阵</span>
    <span class="badge" style="border:1px solid rgba(30,58,95,0.4);padding:3px 12px;color:rgba(30,58,95,0.8);background:rgba(30,58,95,0.04)">龙虾</span>
    <span>32 / 39</span>
  </div>
  <div class="header">
    <h1>龙虾</h1>
    <div class="underline"></div>
  </div>
  <div class="body">
    <div class="hero">
      <div class="label">7×24 小时数字助理</div>
      <div class="title"><span>勤快</span>但不靠谱的实习生</div>
    </div>
    <div class="features">
      <div class="feat">
        <div class="icon">📡</div>
        <div class="text">自动信息采集</div>
      </div>
      <div class="feat">
        <div class="icon">📋</div>
        <div class="text">日报自动生成</div>
      </div>
      <div class="feat">
        <div class="icon">📤</div>
        <div class="text">文件自动分发</div>
      </div>
    </div>
    <div class="warning">
      <div class="label">WARNING</div>
      <div class="text">任务可以交，但<strong>产出必须复核</strong> —— 别让实习生独自交活</div>
    </div>
  </div>
  <div class="hud-bot">
    <span>[53:00] 累计</span>
    <span>龙虾解决"勤" · 复核不可省</span>
  </div>
</div>
</body>
</html>
