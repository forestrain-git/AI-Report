<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P6 团队同步 + 结构性局限</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: #FAFBFC;
    font-family: var(--font-body);
    color: var(--ink-primary);
  }
  .slide {
    width: 100%; height: 100%;
    position: relative;
    padding: 80px 120px;
    display: flex;
    flex-direction: column;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .frame {
    position: absolute; inset: 48px;
    border: 1px solid rgba(37,99,235,0.12);
    pointer-events: none;
  }
  .corner { position: absolute; width: 20px; height: 20px; border: 2px solid rgba(30,58,95,0.4); }
  .corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .corner.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  .hud-top {
    display: flex; justify-content: space-between;
    font-family: var(--font-mono); font-size: 11px;
    color: rgba(30,58,95,0.6); letter-spacing: 0.08em;
    margin-bottom: 48px; z-index: 1;
  }
  .header { margin-bottom: 48px; z-index: 1; }
  .header h1 {
    font-family: var(--font-display); font-size: 72px;
    font-weight: 700; letter-spacing: 0.06em; color: var(--ink-primary); margin-bottom: 16px;
  }
  .header .underline { width: 60px; height: 4px; background: #1E3A5F; box-shadow: 0 0 12px rgba(30,58,95,0.3); }

  .body { flex: 1; display: flex; flex-direction: column; z-index: 1; }
  .team-note {
    font-size: 22px; color: var(--ink-secondary);
    margin-bottom: 40px; letter-spacing: 0.05em;
  }
  .team-note strong { color: #1E3A5F; }
  .cards {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 24px; flex: 1;
  }
  .card {
    border: 1px solid rgba(37,99,235,0.15);
    background: rgba(37,99,235,0.03);
    padding: 36px 40px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .card .num {
    font-family: var(--font-mono); font-size: 13px;
    color: rgba(30,58,95,0.5); letter-spacing: 0.1em;
  }
  .card .title {
    font-size: 26px; font-weight: 600; color: var(--ink-primary);
    letter-spacing: 0.04em;
  }
  .card .desc {
    font-size: 18px; color: var(--ink-secondary); line-height: 1.6;
  }
  .bottom-line {
    margin-top: 32px; text-align: center;
    font-size: 22px; color: var(--ink-secondary);
    letter-spacing: 0.05em;
  }
  .bottom-line strong { color: #1E3A5F; }
  .hud-bot {
    display: flex; justify-content: space-between;
    font-size: 12px; color: rgba(15,23,42,0.5);
    letter-spacing: 0.08em; margin-top: 24px; z-index: 1;
  }
  .hud-bot span { color: rgba(30,58,95,0.5); }
</style>
</head>
<body>
<div class="slide">
  <div class="grid"></div>
  <div class="frame">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div class="hud-top">
    <span>PART 1 · 阶段一</span>
    <span class="badge" style="border:1px solid rgba(30,58,95,0.4);padding:3px 12px;color:rgba(30,58,95,0.8);background:rgba(30,58,95,0.04)">结构性局限</span>
    <span>06 / 39</span>
  </div>
  <div class="header">
    <h1>团队同步 + 结构性局限</h1>
    <div class="underline"></div>
  </div>
  <div class="body">
    <div class="team-note"><strong>中建智能研发团队，绝大多数人也处在这个阶段</strong> —— 遇到问题打开豆包，debug 完拷贝回项目</div>
    <div class="cards">
      <div class="card">
        <div class="num">01</div>
        <div class="title">上下文窗口有限</div>
        <div class="desc">对话稍长 AI 就开始失忆，只能开新会话从头讲背景</div>
      </div>
      <div class="card">
        <div class="num">02</div>
        <div class="title">会话之间是隔离的</div>
        <div class="desc">今天教 AI 的东西，明天另一个对话它一无所知</div>
      </div>
      <div class="card">
        <div class="num">03</div>
        <div class="title">知识没法积累</div>
        <div class="desc">花半小时解释业务背景，下次重开窗口 —— 全部归零</div>
      </div>
      <div class="card">
        <div class="num">04</div>
        <div class="title">输出缺乏针对性</div>
        <div class="desc">AI 不了解你的组织、项目、客户，产出都是通用模板</div>
      </div>
    </div>
    <div class="bottom-line">
      网页聊天的设计初衷，<strong>本来就是给一次性问答用的</strong>
    </div>
  </div>
  <div class="hud-bot">
    <span>[05:30] 累计</span>
    <span>四局限 · 让听众对号入座</span>
  </div>
</div>
</body>
</html>
