<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P37 三个时代的工具</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #FAFBFC; font-family: var(--font-body); color: var(--ink-primary); }
  .slide { width: 100%; height: 100%; position: relative; padding: 80px 120px; display: flex; flex-direction: column; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
  .frame { position: absolute; inset: 48px; border: 1px solid rgba(37,99,235,0.12); pointer-events: none; }
  .corner { position: absolute; width: 20px; height: 20px; border: 2px solid rgba(30,58,95,0.4); }
  .corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .corner.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  .hud-top { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: rgba(30,58,95,0.6); letter-spacing: 0.08em; margin-bottom: 48px; z-index: 1; }
  .header { margin-bottom: 48px; z-index: 1; }
  .header h1 { font-family: var(--font-display); font-size: 72px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-primary); margin-bottom: 16px; }
  .header .underline { width: 60px; height: 4px; background: #1E3A5F; box-shadow: 0 0 12px rgba(30,58,95,0.3); }

  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; z-index: 1; }
  .eras { display: flex; gap: 32px; margin-bottom: 48px; }
  .era { flex: 1; padding: 40px; border: 1px solid rgba(37,99,235,0.15); position: relative; }
  .era.highlight { border-color: rgba(30,58,95,0.6); background: rgba(30,58,95,0.04); }
  .era .label { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.15em; margin-bottom: 16px; }
  .era .label.agri { color: rgba(139,168,119,0.6); }
  .era .label.ind { color: rgba(37,99,235,0.6); }
  .era .label.ai { color: rgba(30,58,95,0.6); }
  .era .title { font-size: 28px; font-weight: 600; color: var(--ink-primary); margin-bottom: 16px; }
  .era .title strong { color: #1E3A5F; }
  .era .desc { font-size: 18px; color: var(--ink-secondary); line-height: 1.6; }
  .conclusion { text-align: center; font-size: 24px; color: var(--ink-secondary); }
  .conclusion strong { color: var(--ink-primary); }
  .hud-bot { display: flex; justify-content: space-between; font-size: 12px; color: rgba(15,23,42,0.5); letter-spacing: 0.08em; margin-top: 24px; z-index: 1; }
  .hud-bot span { color: rgba(30,58,95,0.5); }
</style>
</head>
<body>
<div class="slide">
  <div class="grid"></div>
  <div class="frame">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div class="hud-top">
    <span>PART 3 · 一点思考</span>
    <span class="badge" style="border:1px solid rgba(30,58,95,0.4);padding:3px 12px;color:rgba(30,58,95,0.8);background:rgba(30,58,95,0.04)">历史视角</span>
    <span>37 / 39</span>
  </div>
  <div class="header">
    <h1>三个时代的工具</h1>
    <div class="underline"></div>
  </div>
  <div class="body">
    <div class="eras">
      <div class="era">
        <div class="label agri">AGRICULTURAL</div>
        <div class="title">农业时代</div>
        <div class="desc">工具<strong>增强体力</strong><br>工具是体力的延伸，提升效率</div>
      </div>
      <div class="era">
        <div class="label ind">INDUSTRIAL</div>
        <div class="title">工业时代</div>
        <div class="desc">机器<strong>替代体力</strong><br>改变就业结构——旧岗位消失，新岗位诞生</div>
      </div>
      <div class="era highlight">
        <div class="label ai">AI ERA</div>
        <div class="title">AI 时代</div>
        <div class="desc">算法<strong>替代脑力</strong><br>不是替代某个行业，而是渗透所有行业</div>
      </div>
    </div>
    <div class="conclusion">不同于前两次：AI 正在<strong>所有领域逐步超越所有人、替代所有人</strong></div>
  </div>
  <div class="hud-bot">
    <span>[63:00] 累计</span>
    <span>历史对照 · 时代定位</span>
  </div>
</div>
</body>
</html>
