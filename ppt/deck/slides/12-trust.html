<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P12 信任来自哪里</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: var(--bg-primary);
    font-family: var(--font-body);
    color: var(--ink-primary);
  }

  .slide {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: var(--page-margin);
    position: relative;
  }

  /* ── 背景网格 ── */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(37,99,235,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(37,99,235,0.03) 1px, transparent 1px);
    background-size: 64px 64px;
    pointer-events: none;
  }

  /* ── 页码 ── */
  .page-num {
    position: absolute;
    top: var(--space-sm);
    right: var(--page-margin);
    font-family: var(--font-mono);
    font-size: var(--text-caption);
    color: var(--ink-tertiary);
  }

  /* ── 标题区 ── */
  .header {
    margin-bottom: var(--space-md);
    z-index: 1;
  }

  .header h1 {
    font-family: var(--font-display);
    font-size: var(--text-h1);
    font-weight: 700;
    color: var(--ink-primary);
    letter-spacing: 0.06em;
  }

  .header .underline {
    width: 60px;
    height: 4px;
    background: var(--accent-gold);
    margin-top: var(--space-xs);
    box-shadow: 0 0 12px rgba(30,58,95,0.3);
  }

  /* ── 主体内容区 ── */
  .body {
    flex: 1;
    display: flex;
    gap: var(--space-lg);
    align-items: center;
    z-index: 1;
  }

  /* ── 左侧：金字塔 ── */
  .pyramid-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-xs);
    position: relative;
  }

  .pyramid-tier {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: var(--text-h3);
    font-weight: 600;
    position: relative;
    clip-path: polygon(6% 0%, 94% 0%, 100% 100%, 0% 100%);
    padding: var(--space-sm) 0;
    transition: transform 0.3s ease;
  }

  .tier-top {
    width: 360px;
    background: linear-gradient(180deg, rgba(30,58,95,0.95) 0%, rgba(30,58,95,0.75) 100%);
    color: var(--bg-primary);
    font-family: var(--font-display);
    letter-spacing: 0.1em;
    border: 1px solid rgba(30,58,95,0.6);
    box-shadow: 0 0 24px rgba(30,58,95,0.2);
  }

  .tier-mid {
    width: 540px;
    background: rgba(30,58,95,0.08);
    color: var(--ink-primary);
    border: 1px solid rgba(30,58,95,0.4);
  }

  .tier-bot {
    width: 720px;
    background: rgba(37,99,235,0.06);
    color: var(--ink-primary);
    border: 1px solid rgba(37,99,235,0.18);
  }

  .tier-label {
    position: absolute;
    left: calc(100% + var(--space-md));
    white-space: nowrap;
    font-size: var(--text-body);
    color: var(--ink-tertiary);
    font-weight: 400;
    font-family: var(--font-mono);
    letter-spacing: 0.05em;
  }

  .tier-top .tier-label  { color: var(--accent-gold); }

  /* 左侧竖线装饰 */
  .pyramid-wrap::before {
    content: '';
    position: absolute;
    left: -40px;
    top: 10%;
    bottom: 10%;
    width: 1px;
    background: linear-gradient(180deg, transparent 0%, var(--accent-gold-dim) 30%, var(--accent-blue-dim) 70%, transparent 100%);
  }

  /* ── 右侧：金句 ── */
  .quote-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: var(--space-md);
    padding-left: var(--space-lg);
    position: relative;
  }

  .quote-wrap::before {
    content: '';
    position: absolute;
    left: 0;
    top: 15%;
    bottom: 15%;
    width: 1px;
    background: linear-gradient(180deg, transparent 0%, var(--accent-gold-dim) 20%, var(--accent-gold-dim) 80%, transparent 100%);
  }

  .quote-text {
    font-family: var(--font-display);
    font-size: var(--text-h2);
    color: var(--accent-gold);
    line-height: 1.6;
    letter-spacing: 0.04em;
    text-shadow: 0 0 40px rgba(30,58,95,0.25);
  }

  .quote-sub {
    font-size: var(--text-h3);
    color: var(--ink-secondary);
    line-height: 1.6;
    font-weight: 400;
  }

  .quote-note {
    font-size: var(--text-body);
    color: var(--ink-tertiary);
    margin-top: var(--space-sm);
    font-family: var(--font-mono);
    letter-spacing: 0.05em;
  }

  /* ── 底部阶段标记 ── */
  .stage-badge {
    position: absolute;
    bottom: var(--space-sm);
    left: var(--page-margin);
    font-family: var(--font-mono);
    font-size: var(--text-caption);
    color: var(--ink-tertiary);
    letter-spacing: 0.1em;
    z-index: 1;
  }

  .stage-badge span {
    color: var(--accent-gold);
  }
</style>
</head>
<body>

<div class="slide">
  <div class="grid-overlay"></div>

  <div class="page-num">12 / 39</div>

  <div class="header">
    <h1>信任来自哪里</h1>
    <div class="underline"></div>
  </div>

  <div class="body">
    <!-- 左侧金字塔 -->
    <div class="pyramid-wrap">
      <div class="pyramid-tier tier-top">
        AI 辅助
        <span class="tier-label">01 · 可视化放大</span>
      </div>
      <div class="pyramid-tier tier-mid">
        多年行业积累
        <span class="tier-label">02 · 专业厚度</span>
      </div>
      <div class="pyramid-tier tier-bot">
        中建品牌信用
        <span class="tier-label">03 · 平台根基</span>
      </div>
    </div>

    <!-- 右侧金句 -->
    <div class="quote-wrap">
      <div class="quote-text">
        「AI 是放大器，是加速器，<br>但不是魔术师。」
      </div>
      <div class="quote-sub">
        自身积累越厚，<br>AI 的放大效应才越显著。
      </div>
      <div class="quote-note">
        第一课 <span style="color:var(--accent-gold)">·</span> 阶段二收尾
      </div>
    </div>
  </div>

  <div class="stage-badge">PART 1 <span>·</span> 阶段二 —— AI 编程觉醒</div>
</div>

</body>
</html>
