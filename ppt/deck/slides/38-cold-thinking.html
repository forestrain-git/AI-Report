<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P38 冷思考</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a1628; font-family: var(--font-body); color: var(--ink-primary); }
  .slide { width: 100%; height: 100%; position: relative; padding: 80px 120px; display: flex; flex-direction: column; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
  .frame { position: absolute; inset: 48px; border: 1px solid rgba(74,144,217,0.12); pointer-events: none; }
  .corner { position: absolute; width: 20px; height: 20px; border: 2px solid rgba(201,169,97,0.4); }
  .corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .corner.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  .hud-top { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: rgba(74,144,217,0.4); letter-spacing: 0.08em; margin-bottom: 48px; z-index: 1; }
  .header { margin-bottom: 48px; z-index: 1; }
  .header h1 { font-family: var(--font-display); font-size: 72px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-primary); margin-bottom: 16px; }
  .header .underline { width: 60px; height: 4px; background: #C9A961; box-shadow: 0 0 12px rgba(201,169,97,0.3); }

  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; z-index: 1; }
  .positive { text-align: center; font-size: 28px; color: var(--ink-secondary); margin-bottom: 48px; }
  .positive strong { color: var(--ink-primary); }
  .cold { text-align: center; padding: 48px 80px; border: 2px solid rgba(220,80,60,0.2); background: rgba(220,80,60,0.03); margin-bottom: 48px; }
  .cold .label { font-family: var(--font-mono); font-size: 12px; color: rgba(220,80,60,0.5); letter-spacing: 0.2em; margin-bottom: 20px; }
  .cold .text { font-size: 36px; color: var(--ink-primary); line-height: 1.6; }
  .cold .text strong { color: #C9A961; }
  .response { display: flex; gap: 32px; justify-content: center; }
  .resp { flex: 1; max-width: 420px; padding: 32px; border: 1px solid rgba(201,169,97,0.15); }
  .resp .title { font-size: 20px; font-weight: 600; color: var(--ink-primary); margin-bottom: 12px; }
  .resp .title span { color: #C9A961; }
  .resp .text { font-size: 18px; color: var(--ink-secondary); line-height: 1.6; }
  .hud-bot { display: flex; justify-content: space-between; font-size: 12px; color: rgba(232,232,232,0.25); letter-spacing: 0.08em; margin-top: 24px; z-index: 1; }
  .hud-bot span { color: rgba(201,169,97,0.5); }
</style>
</head>
<body>
<div class="slide">
  <div class="grid"></div>
  <div class="frame">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div class="hud-top">
    <span>PART 3 · 一点思考</span>
    <span class="badge" style="border:1px solid rgba(220,80,60,0.25);padding:3px 12px;color:rgba(220,80,60,0.55);background:rgba(220,80,60,0.04)">全场最重</span>
    <span>38 / 39</span>
  </div>
  <div class="header">
    <h1>冷思考</h1>
    <div class="underline"></div>
  </div>
  <div class="body">
    <div class="positive">
      积极面：每个人都能拥有 AI 助手，<strong>能力门槛持续降低</strong>
    </div>
    <div class="cold">
      <div class="label">COLD TRUTH</div>
      <div class="text">人类即将被 AI 物化<br>沦为 AI 在物理世界的<strong>传感器、手臂、背锅侠</strong></div>
    </div>
    <div class="response">
      <div class="resp">
        <div class="title"><span>01</span> 跟上时代</div>
        <div class="text">学习 AI、使用 AI，不让工具替代自己</div>
      </div>
      <div class="resp">
        <div class="title"><span>02</span> 寻找存在价值</div>
        <div class="text">不依赖外界评估的存在价值——AI 给不了的意义</div>
      </div>
    </div>
  </div>
  <div class="hud-bot">
    <span>[65:00] 累计</span>
    <span>讲完停 3 秒 · 让全场安静</span>
  </div>
</div>
</body>
</html>
