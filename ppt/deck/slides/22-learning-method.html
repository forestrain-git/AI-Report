
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P22 AI 时代学习方法</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a1628; font-family: var(--font-body); color: var(--ink-primary); }
  .slide { width: 100%; height: 100%; position: relative; padding: 80px 120px; display: flex; flex-direction: column; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
  .frame { position: absolute; inset: 48px; border: 1px solid rgba(74,144,217,0.12); pointer-events: none; }
  .corner { position: absolute; width: 20px; height: 20px; border: 2px solid rgba(201,169,97,0.4); }
  .corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .corner.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  .hud-top { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: rgba(74,144,217,0.4); letter-spacing: 0.08em; margin-bottom: 48px; z-index: 1; }
  .header { margin-bottom: 48px; z-index: 1; }
  .header h1 { font-family: var(--font-display); font-size: 72px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-primary); margin-bottom: 16px; }
  .header .underline { width: 60px; height: 4px; background: #C9A961; box-shadow: 0 0 12px rgba(201,169,97,0.3); }

  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; z-index: 1; }
  .intro { text-align: center; font-size: 24px; color: var(--ink-secondary); margin-bottom: 48px; }
  .intro strong { color: #C9A961; }
  .steps { display: flex; gap: 24px; }
  .step { flex: 1; padding: 32px; border: 1px solid rgba(74,144,217,0.15); position: relative; }
  .step .num { font-family: var(--font-display); font-size: 48px; font-weight: 700; color: rgba(201,169,97,0.15); line-height: 1; margin-bottom: 16px; }
  .step .title { font-size: 22px; font-weight: 600; color: var(--ink-primary); margin-bottom: 12px; }
  .step .desc { font-size: 16px; color: var(--ink-secondary); line-height: 1.6; }
  .step-arrow { display: flex; align-items: center; font-size: 24px; color: rgba(201,169,97,0.3); }
  .contrast { margin-top: 48px; text-align: center; font-size: 20px; color: var(--ink-tertiary); }
  .contrast strong { color: var(--ink-secondary); }
  .hud-bot { display: flex; justify-content: space-between; font-size: 12px; color: rgba(232,232,232,0.25); letter-spacing: 0.08em; margin-top: 24px; z-index: 1; }
  .hud-bot span { color: rgba(201,169,97,0.5); }
</style>
</head>
<body>
<div class="slide">
  <div class="grid"></div>
  <div class="frame">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div class="hud-top">
    <span>PART 1 · 阶段三</span>
    <span class="badge" style="border:1px solid rgba(201,169,97,0.25);padding:3px 12px;color:rgba(201,169,97,0.55);background:rgba(201,169,97,0.04)">学习方法</span>
    <span>22 / 39</span>
  </div>
  <div class="header">
    <h1>AI 时代学习方法</h1>
    <div class="underline"></div>
  </div>
  <div class="body">
    <div class="intro"><strong>别光看，要用</strong> · <strong>别先学再用，直接用，在用中学</strong></div>
    <div class="steps">
      <div class="step">
        <div class="num">01</div>
        <div class="title">提炼核心</div>
        <div class="desc">让 AI 提炼领域 <strong>20%</strong> 核心知识，覆盖 <strong>80%</strong> 场景</div>
      </div>
      <div class="step-arrow">→</div>
      <div class="step">
        <div class="num">02</div>
        <div class="title">做出 MVP</div>
        <div class="desc">用这 20% 核心知识，做出<strong>最简单的最小可用版本</strong></div>
      </div>
      <div class="step-arrow">→</div>
      <div class="step">
        <div class="num">03</div>
        <div class="title">逐个摸清</div>
        <div class="desc">针对里面的知识点，<strong>逐个深入</strong>，哪里卡补哪里</div>
      </div>
      <div class="step-arrow">→</div>
      <div class="step" style="border-color:rgba(201,169,97,0.2);background:rgba(201,169,97,0.04)">
        <div class="num">04</div>
        <div class="title">快速入门</div>
        <div class="desc">不是学完再用，是<strong>用起来以后再回过头补理论</strong></div>
      </div>
    </div>
    <div class="contrast">传统路径：看书 → 看视频 → 做练习 → 实战（几个月）<br><strong>AI 路径：直接实战 → 边用边学（几天）</strong></div>
  </div>
  <div class="hud-bot">
    <span>[33:00] 累计</span>
    <span>四步学法 · 阶段三收尾</span>
  </div>
</div>
</body>
</html>
