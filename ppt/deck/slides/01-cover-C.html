<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>封面 C · Editorial 杂志风</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: #0D1117;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    color: #0F172A;
  }
  .slide {
    width: 100%; height: 100%;
    position: relative;
    padding: 100px 140px;
    display: grid;
    grid-template-rows: 1fr auto 1fr;
    grid-template-columns: 1fr 1fr;
  }

  /* 巨型背景数字 */
  .bg-year {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: "Noto Sans SC", sans-serif;
    font-size: 520px;
    font-weight: 700;
    color: rgba(15,23,42,0.018);
    letter-spacing: 0.05em;
    pointer-events: none;
    line-height: 1;
  }

  /* 细线网格 */
  .slide::before {
    content: '';
    position: absolute;
    inset: 60px;
    border: 1px solid rgba(30,58,95,0.08);
    pointer-events: none;
  }
  .slide::after {
    content: '';
    position: absolute;
    top: 60px; bottom: 60px; left: 50%;
    width: 1px;
    background: linear-gradient(180deg, transparent 10%, rgba(30,58,95,0.12) 50%, transparent 90%);
    pointer-events: none;
  }

  /* 左上角：系列标记 */
  .series-mark {
    grid-row: 1; grid-column: 1;
    align-self: start; justify-self: start;
    font-family: "SF Mono", monospace;
    font-size: 13px;
    color: rgba(30,58,95,0.5);
    letter-spacing: 0.15em;
    writing-mode: vertical-rl;
    text-orientation: mixed;
  }

  /* 右上：日期 */
  .date-mark {
    grid-row: 1; grid-column: 2;
    align-self: start; justify-self: end;
    font-size: 14px;
    color: rgba(15,23,42,0.3);
    letter-spacing: 0.1em;
    text-align: right;
    line-height: 1.8;
  }

  /* 左下：主标题 */
  .title-block {
    grid-row: 3; grid-column: 1;
    align-self: end; justify-self: start;
  }
  .title-block h1 {
    font-family: "Noto Sans SC", sans-serif;
    font-size: 88px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: 0.04em;
    color: #0F172A;
  }
  .title-block h1 .gold { color: #1E3A5F; }
  .title-block .line {
    width: 100px;
    height: 3px;
    background: #1E3A5F;
    margin: 32px 0;
  }
  .title-block .sub {
    font-size: 24px;
    color: rgba(15,23,42,0.5);
    letter-spacing: 0.12em;
    font-family: "Noto Sans SC", sans-serif;
  }

  /* 右下：公司名 + 编号 */
  .meta-block {
    grid-row: 3; grid-column: 2;
    align-self: end; justify-self: end;
    text-align: right;
  }
  .meta-block .co {
    font-size: 18px;
    color: rgba(15,23,42,0.4);
    letter-spacing: 0.2em;
    margin-bottom: 24px;
  }
  .meta-block .issue {
    font-family: "Noto Sans SC", sans-serif;
    font-size: 72px;
    font-weight: 700;
    color: rgba(30,58,95,0.25);
    line-height: 1;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-year">2026</div>

  <div class="series-mark">CSCEC.INTELLIGENT</div>

  <div class="date-mark">
    2026.05<br>
    BEIJING
  </div>

  <div class="title-block">
    <h1>AI <span class="gold">觉醒</span><br>经历分享</h1>
    <div class="line"></div>
    <p class="sub">一个老程序员两个月的记录</p>
  </div>

  <div class="meta-block">
    <div class="co">中建智能技术有限公司</div>
    <div class="issue">01</div>
  </div>
</div>
</body>
</html>
