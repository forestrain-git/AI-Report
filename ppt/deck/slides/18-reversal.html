
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P18 反转——规矩约束不住</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #FAFBFC; font-family: var(--font-body); color: var(--ink-primary); }
  .slide { width: 100%; height: 100%; position: relative; padding: 80px 120px; display: flex; flex-direction: column; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
  .frame { position: absolute; inset: 48px; border: 1px solid rgba(37,99,235,0.12); pointer-events: none; }
  .corner { position: absolute; width: 20px; height: 20px; border: 2px solid rgba(30,58,95,0.4); }
  .corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .corner.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  .hud-top { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: rgba(30,58,95,0.6); letter-spacing: 0.08em; margin-bottom: 48px; z-index: 1; }
  .header { margin-bottom: 48px; z-index: 1; }
  .header h1 { font-family: var(--font-display); font-size: 72px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-primary); margin-bottom: 16px; }
  .header .underline { width: 60px; height: 4px; background: #1E3A5F; box-shadow: 0 0 12px rgba(30,58,95,0.3); }

  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; z-index: 1; }
  .subtitle { text-align: center; font-size: 28px; color: var(--ink-secondary); margin-bottom: 48px; }
  .subtitle strong { color: #1E3A5F; }
  .pits { display: flex; flex-direction: column; gap: 24px; }
  .pit { display: flex; gap: 32px; padding: 28px 40px; border: 1px solid rgba(220,80,60,0.15); background: rgba(220,80,60,0.02); align-items: flex-start; }
  .pit .num { font-family: var(--font-mono); font-size: 14px; color: rgba(220,80,60,0.5); letter-spacing: 0.1em; min-width: 60px; }
  .pit .text { font-size: 22px; color: var(--ink-primary); line-height: 1.5; }
  .pit .text span { color: var(--ink-tertiary); font-size: 18px; }
  .hud-bot { display: flex; justify-content: space-between; font-size: 12px; color: rgba(15,23,42,0.5); letter-spacing: 0.08em; margin-top: 24px; z-index: 1; }
  .hud-bot span { color: rgba(30,58,95,0.5); }
</style>
</head>
<body>
<div class="slide">
  <div class="grid"></div>
  <div class="frame">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div class="hud-top">
    <span>PART 1 · 阶段三</span>
    <span class="badge" style="border:1px solid rgba(30,58,95,0.4);padding:3px 12px;color:rgba(30,58,95,0.8);background:rgba(30,58,95,0.04)">三个坑</span>
    <span>18 / 39</span>
  </div>
  <div class="header">
    <h1>反转 —— 规矩约束不住龙虾</h1>
    <div class="underline"></div>
  </div>
  <div class="body">
    <div class="subtitle">规矩的限制，<strong>太容易被突破</strong></div>
    <div class="pits">
      <div class="pit">
        <div class="num">坑 01</div>
        <div class="text">你让他不准自己干活，他一不小心就自己上手了<br><span>道歉 → 再犯 → 道歉 → 再犯</span></div>
      </div>
      <div class="pit">
        <div class="num">坑 02</div>
        <div class="text">把内部架构直接写进交付文件 —— 方案里出现"户部""兵部"<br><span>改完这一段，下一段又冒出来</span></div>
      </div>
      <div class="pit">
        <div class="num">坑 03</div>
        <div class="text">你说"局部精修"，他给你"全盘重构"<br><span>调好的细节，全没了。token 烧了无数</span></div>
      </div>
    </div>
  </div>
  <div class="hud-bot">
    <span>[26:30] 累计</span>
    <span>自动化工具 · 最大成本是信任后没复核的代价</span>
  </div>
</div>
</body>
</html>
