
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P11 两次汇报</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: #0a1628;
    font-family: var(--font-body);
    color: var(--ink-primary);
  }
  .slide {
    width: 100%; height: 100%;
    position: relative;
    padding: 80px 120px;
    display: flex;
    flex-direction: column;
  }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
  .frame { position: absolute; inset: 48px; border: 1px solid rgba(74,144,217,0.12); pointer-events: none; }
  .corner { position: absolute; width: 20px; height: 20px; border: 2px solid rgba(201,169,97,0.4); }
  .corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .corner.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  .hud-top { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: rgba(74,144,217,0.4); letter-spacing: 0.08em; margin-bottom: 48px; z-index: 1; }
  .header { margin-bottom: 48px; z-index: 1; }
  .header h1 { font-family: var(--font-display); font-size: 72px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-primary); margin-bottom: 16px; }
  .header .underline { width: 60px; height: 4px; background: #C9A961; box-shadow: 0 0 12px rgba(201,169,97,0.3); }

  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; z-index: 1; }
  .timeline { display: flex; gap: 0; align-items: stretch; margin-bottom: 48px; }
  .tl-item { flex: 1; padding: 40px; border: 1px solid rgba(74,144,217,0.15); position: relative; }
  .tl-item.highlight { border-color: rgba(201,169,97,0.3); background: rgba(201,169,97,0.04); }
  .tl-item .step { font-family: var(--font-mono); font-size: 12px; color: rgba(201,169,97,0.5); letter-spacing: 0.15em; margin-bottom: 16px; }
  .tl-item .title { font-size: 28px; font-weight: 600; color: var(--ink-primary); margin-bottom: 12px; }
  .tl-item .desc { font-size: 18px; color: var(--ink-secondary); line-height: 1.6; }
  .tl-arrow { display: flex; align-items: center; justify-content: center; width: 60px; font-size: 24px; color: rgba(201,169,97,0.4); }
  .result-box { text-align: center; padding: 24px; border: 1px solid rgba(201,169,97,0.25); background: rgba(201,169,97,0.05); }
  .result-box .text { font-size: 28px; color: #C9A961; letter-spacing: 0.1em; }
  .pdf-link { text-align: center; margin-top: 32px; }
  .pdf-link a { display: inline-block; padding: 14px 40px; border: 1px solid rgba(201,169,97,0.4); color: #C9A961; font-size: 16px; letter-spacing: 0.1em; text-decoration: none; font-family: var(--font-mono); background: rgba(201,169,97,0.05); }
  .hud-bot { display: flex; justify-content: space-between; font-size: 12px; color: rgba(232,232,232,0.25); letter-spacing: 0.08em; margin-top: 24px; z-index: 1; }
  .hud-bot span { color: rgba(201,169,97,0.5); }
</style>
</head>
<body>
<div class="slide">
  <div class="grid"></div>
  <div class="frame">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div class="hud-top">
    <span>PART 1 · 阶段二</span>
    <span class="badge" style="border:1px solid rgba(201,169,97,0.25);padding:3px 12px;color:rgba(201,169,97,0.55);background:rgba(201,169,97,0.04)">关键时刻</span>
    <span>11 / 39</span>
  </div>
  <div class="header">
    <h1>两次汇报</h1>
    <div class="underline"></div>
  </div>
  <div class="body">
    <div class="timeline">
      <div class="tl-item">
        <div class="step">STEP 01</div>
        <div class="title">Kimi 10 分钟出初稿</div>
        <div class="desc">提示词 → 初稿 → 调 1 小时 → 口水稿逐字稿</div>
      </div>
      <div class="tl-arrow">→</div>
      <div class="tl-item highlight">
        <div class="step">STEP 02</div>
        <div class="title">第一次汇报</div>
        <div class="desc">给投资总监 · 远程 · 通过<br>关注点跳到投资金额</div>
      </div>
      <div class="tl-arrow">→</div>
      <div class="tl-item highlight">
        <div class="step">STEP 03</div>
        <div class="title">第二次汇报</div>
        <div class="desc">给总经理 · 当面 · 深化 → 通过</div>
      </div>
    </div>
    <div class="result-box">
      <div class="text">两次汇报均通过 · 获得业主初步认可</div>
    </div>
    <div class="pdf-link">
      <a href="../../assets/260317-城市第六器官·环卫智能体.pdf" target="_blank">> 现场打开 PDF 看结构</a>
    </div>
  </div>
  <div class="hud-bot">
    <span>[13:30] 累计</span>
    <span>AI 在压力时刻顶住了</span>
  </div>
</div>
</body>
</html>
