<style>
  body {
    padding: 50px 80px 30px;
    background: #fff;
    display: flex;
    flex-direction: column;
    height: 1080px;
  }

  .slide-title {
    margin-bottom: 24px;
  }

  .case-body {
    display: grid;
    grid-template-columns: 55% 45%;
    gap: 28px;
    flex: 1;
    min-height: 0;
  }

  .case-info {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .info-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 4px;
  }

  .demo-tag {
    background: linear-gradient(135deg, #dbeafe, #eff6ff);
    color: #1e40af;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    border: 1px solid #bfdbfe;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .role-tag {
    background: #f3e8ff;

    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    border: 1px solid #d8b4fe;
  }

  .info-section {
    background: #f8fafc;
    border-radius: 12px;
    padding: 20px 24px;
    border-left: 4px solid #7c3aed;
  }

  .info-section .sec-label {
    font-size: 15px;
    color: #94a3b8;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .info-section .sec-content {
    font-size: 19px;
    color: #334155;
    line-height: 1.6;
  }

  .info-section .sec-content b {
    color: #7c3aed;
    font-weight: 700;
  }

  .metric-row {
    display: flex;
    gap: 16px;
  }

  .metric-box {
    flex: 1;
    background: #fff;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    padding: 16px 20px;
    text-align: center;
  }

  .metric-box .num {
    font-family: "Inter", sans-serif;
    font-size: 36px;
    font-weight: 800;
    color: #7c3aed;
    line-height: 1.1;
  }

  .metric-box .label {
    font-size: 15px;
    color: #64748b;
    margin-top: 4px;
  }

  .demo-zone {
    background: #f1f5f9;
    border: 2px solid #e2e8f0;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 12px;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .demo-zone:hover {
    border-color: #1A56DB;
    box-shadow: 0 0 0 3px rgba(26,86,219,0.15);
  }

  .demo-zone::after {
    content: '👆 点击预览交互 Demo';
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.65);
    color: #fff;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    white-space: nowrap;
  }

  .demo-zone:hover::after {
    opacity: 1;
  }

  .demo-zone img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }

  .signal-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: linear-gradient(135deg, #f3e8ff, #faf5ff);
    border: 2px solid #d8b4fe;
    border-radius: 12px;
    padding: 18px 32px;
    margin-top: 20px;
  }

  .signal-bar .text {
    font-size: 20px;
    font-weight: 700;
    color: #6b21a8;
    font-style: italic;

      <div class="metric-box">

  </div>
</div>

  <span class="text">"连总工都在亲手写代码。这不是研发部的事，是每个人的事。"</span>
