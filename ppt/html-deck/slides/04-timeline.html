<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P04 · 核心政策时间线</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/slide-system.css">
<style>
  body {
    padding: 50px 80px 30px;
    background: #fff;
    display: flex;
    flex-direction: column;
    height: 1080px;
  }

  .slide-title {
    margin-bottom: 60px;
  }

  /* 水平时间线 */
  .timeline-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }

  .timeline-h {
    display: flex;
    align-items: flex-start;
    gap: 0;
    position: relative;
    padding-top: 40px;
  }

  .timeline-h::before {
    content: '';
    position: absolute;
    top: 52px;
    left: 60px;
    right: 60px;
    height: 4px;
    background: linear-gradient(90deg, #1e40af, #3b82f6, #0ea5e9, #f59e0b, #dc2626);
    border-radius: 2px;
  }

  .timeline-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 16px;
    position: relative;
    z-index: 1;
  }

  .timeline-item .dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 5px solid #fff;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    margin-bottom: 20px;
    flex-shrink: 0;
  }

  .dot-1 { background: #1e40af; }
  .dot-2 { background: #2563eb; }
  .dot-3 { background: #3b82f6; }
  .dot-4 { background: #0ea5e9; }
  .dot-5 { background: #dc2626; box-shadow: 0 2px 16px rgba(220,38,38,0.35); }

  .timeline-item .year {
    font-family: "Inter", sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: #0f172a;
    margin-bottom: 12px;
  }

  .timeline-item .event {
    font-size: 18px;
    color: #475569;
    line-height: 1.6;
    max-width: 280px;
  }

  .timeline-item .note {
    font-size: 15px;
    color: #94a3b8;
    margin-top: 8px;
  }

  /* 最后一个节点强调 */
  .item-last .year {
    color: #dc2626;
  }

  /* 底部警示区 */
  .alert-box {
    background: linear-gradient(135deg, #fef2f2, #fee2e2);
    border: 2px solid #fecaca;
    border-radius: 14px;
    padding: 28px 40px;
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 40px;
  }

  .alert-box .alert-icon {
    font-size: 40px;
    flex-shrink: 0;
  }

  .alert-box .alert-text {
    font-size: 20px;
    color: #7f1d1d;
    line-height: 1.6;
  }

  .alert-box .alert-text b {
    color: #dc2626;
    font-weight: 700;
  }
</style>
</head>
<body>

<div class="slide-title">核心政策时间线</div>

<div class="timeline-wrap">
  <div class="timeline-h">
    <div class="timeline-item">
      <div class="dot dot-1"></div>
      <div class="year">2020</div>
      <div class="event">国资委《关于加快推进国有企业数字化转型工作的通知》</div>
      <div class="note">数字化转型启动</div>
    </div>
    <div class="timeline-item">
      <div class="dot dot-2"></div>
      <div class="year">2023</div>
      <div class="event">AI列为战略性新兴产业</div>
      <div class="note">国家战略定位</div>
    </div>
    <div class="timeline-item">
      <div class="dot dot-3"></div>
      <div class="year">2024-2025</div>
      <div class="event">国资委"AI+"专项行动，考核指标纳入</div>
      <div class="note">考核挂钩</div>
    </div>
    <div class="timeline-item">
      <div class="dot dot-4"></div>
      <div class="year">2025</div>
      <div class="event">两会"人工智能+"行动，新质生产力核心概念</div>
      <div class="note">写入政府工作报告</div>
    </div>
    <div class="timeline-item item-last">
      <div class="dot dot-5"></div>
      <div class="year">2025</div>
      <div class="event">新修订《网络安全法》施行，罚款上限提至5000万/营业额5%</div>
      <div class="note">负责人最高100万罚款+从业禁止</div>
    </div>
  </div>

  <div class="alert-box">
    <div class="alert-icon">⚠️</div>
    <div class="alert-text">
      <b>罚款上限5000万 + 负责人个人责任 + 从业禁止</b> —— 2025年新修订《网络安全法》大幅提高违规成本，同时《生成式AI暂行办法》等配套法规持续收紧。
    </div>
  </div>
</div>

<div class="page-footer">
  <span class="part-label">Part 1 · 政策锚定</span>
  <span class="page-num">4 / 47</span>
</div>

</body>
</html>
