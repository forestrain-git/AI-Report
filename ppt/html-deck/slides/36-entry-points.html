<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P36 · 最容易的切入点</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/slide-system.css">
<style>
  body {
    padding: 50px 80px 30px;
    background: #fff;
    display: flex;
    flex-direction: column;
    height: 1080px;
  }
  .option-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
    margin-top: 20px;
  }
  .option-row {
    display: grid;
    grid-template-columns: 80px 160px 140px 100px 120px 1fr 1fr;
    align-items: center;
    gap: 16px;
    padding: 20px 24px;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    background: #fff;
    font-size: 18px;
    color: var(--ink-body);
  }
  .option-row:first-child {
    background: #f8fafc;
    font-weight: 700;
    color: var(--brand-blue);
    font-size: 16px;
    border-bottom: 2px solid #cbd5e1;
  }
  .option-letter {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 900;
    color: #fff;
  }
  .opt-a { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
  .opt-b { background: linear-gradient(135deg, #0891b2, #0e7490); }
  .opt-c { background: linear-gradient(135deg, #059669, #047857); }
  .opt-d { background: linear-gradient(135deg, #d97706, #b45309); }
  .option-row .cell-label {
    font-size: 14px;
    color: var(--ink-dim);
    margin-bottom: 2px;
  }
  .option-row .cell-value {
    font-weight: 700;
    color: var(--ink-title);
  }
  .option-row .effect {
    color: var(--brand-blue);
    font-weight: 700;
  }
  .option-row .provide {
    color: var(--ink-body);
    line-height: 1.4;
  }
  .bottom-line {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink-title);
    padding: 20px 0;
    border-top: 2px solid #e2e8f0;
    margin-top: 16px;
  }
  .bottom-line span {
    color: var(--brand-blue);
  }
</style>
</head>
<body>

<div class="slide-title">如果想试试——几个最容易的切入点</div>

<div class="option-list">
  <div class="option-row">
    <div></div>
    <div>选项</div>
    <div>适合谁</div>
    <div>周期</div>
    <div>投入</div>
    <div>预期效果</div>
    <div>我们能提供</div>
  </div>
  <div class="option-row">
    <div class="option-letter opt-a">A</div>
    <div class="cell-value">办公提效</div>
    <div>所有部门</div>
    <div>1-2 周</div>
    <div>零成本</div>
    <div class="effect">纪要 30min → 5min</div>
    <div class="provide">工具 + 模板 + 短培训</div>
  </div>
  <div class="option-row">
    <div class="option-letter opt-b">B</div>
    <div class="cell-value">制度知识库</div>
    <div>职能部门</div>
    <div>2-4 周</div>
    <div>低</div>
    <div class="effect">制度秒查</div>
    <div class="provide">底座 + 部署 + 全流程</div>
  </div>
  <div class="option-row">
    <div class="option-letter opt-c">C</div>
    <div class="cell-value">业务系统搭建</div>
    <div>有痛点的业务线</div>
    <div>1-4 周</div>
    <div>低-中</div>
    <div class="effect">1 人 × 数天上线</div>
    <div class="provide">平台 + 方法论 + 陪伴</div>
  </div>
  <div class="option-row">
    <div class="option-letter opt-d">D</div>
    <div class="cell-value">全员 AI 培训</div>
    <div>全员</div>
    <div>1-3 月</div>
    <div>低</div>
    <div class="effect">消除恐惧 → 形成文化</div>
    <div class="provide">课程 + 讲师 + 平台</div>
  </div>
</div>

<div class="bottom-line">
  不需要等条件成熟——这四个选项，<span>今天就能启动任何一个</span>。
</div>

<div class="page-footer">
  <span class="part-label">Part 5 · 落地路径</span>
  <span class="page-num">36 / 47</span>
</div>

</body>
</html>
