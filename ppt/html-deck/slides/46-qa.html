<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P46 · Q&A 交流页</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/slide-system.css">
<style>
  body {
    padding: 50px 80px 30px;
    background: #fff;
    display: flex;
    flex-direction: column;
    height: 1080px;
    justify-content: center;
    align-items: center;
  }

  .qa-center {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  .qa-big {
    font-family: "Inter", "Noto Sans SC", sans-serif;
    font-size: 200px;
    font-weight: 900;
    color: var(--brand-blue);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .qa-sub {
    font-size: 42px;
    font-weight: 500;
    color: var(--ink-dim);
    letter-spacing: 0.15em;
  }

  .qa-line {
    width: 80px;
    height: 4px;
    background: linear-gradient(90deg, var(--brand-blue), var(--brand-cyan));
    border-radius: 2px;
  }

  .qa-contact {
    margin-top: 60px;
    font-size: 18px;
    color: var(--ink-subtle);
    line-height: 1.8;
  }

  .page-footer {
    position: absolute;
    bottom: 30px;
    left: 80px;
    right: 80px;
  }
</style>
</head>
<body>

<div class="qa-center">
  <div class="qa-big">Q&A</div>
  <div class="qa-line"></div>
  <div class="qa-sub">欢迎提问</div>
  <div class="qa-contact">
    关于 AI 落地的任何问题，我们随时交流
  </div>
</div>

<div class="page-footer">
  <span class="part-label">附录</span>
  <span class="page-num">46 / 47</span>
</div>

</body>
</html>
