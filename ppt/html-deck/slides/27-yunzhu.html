<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P27 · 中建电商·云筑网</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/slide-system.css">
<style>
  body {
    padding: 50px 80px 30px;
    background: #fff;
    display: flex;
    flex-direction: column;
    height: 1080px;
  }
  /* 顶部荣誉标签 */
  .honor-row {
    display: flex;
    gap: 20px;
    margin-bottom: 24px;
  }
  .honor-tag {
    flex: 1;
    background: linear-gradient(135deg, #fef3c7, #fde68a);
    border: 2px solid #d97706;
    border-radius: 12px;
    padding: 16px 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    overflow: hidden;
  }
  .honor-tag::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #d97706, #f59e0b);
  }
  .honor-tag .honor-icon {
    font-size: 28px;
  }
  .honor-tag .honor-title {
    font-size: 18px;
    font-weight: 800;
    color: #92400e;
  }
  .honor-tag .honor-desc {
    font-size: 14px;
    color: #b45309;
  }
  .honor-tag.red {
    background: linear-gradient(135deg, #fee2e2, #fecaca);
    border-color: #dc2626;
  }
  .honor-tag.red::before {
    background: linear-gradient(90deg, #dc2626, #ef4444);
  }
  .honor-tag.red .honor-title { color: #991b1b; }
  .honor-tag.red .honor-desc { color: #b91c1c; }

  /* 中部大数字卡片阵 */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    flex: 1;
    min-height: 0;
  }
  .stat-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }
  .stat-card .big-num {
    font-family: "Inter", sans-serif;
    font-size: 64px;
    font-weight: 900;
    line-height: 1.05;
    color: var(--brand-blue);
  }
  .stat-card .big-num.red { color: var(--red); }
  .stat-card .big-num.green { color: var(--green); }
  .stat-card .big-num .unit {
    font-size: 22px;
    font-weight: 500;
    margin-left: 4px;
  }
  .stat-card .stat-label {
    font-size: 18px;
    color: var(--ink-body);
    line-height: 1.5;
  }
  .stat-card .stat-arrow {
    font-size: 20px;
    font-weight: 700;
    color: var(--green);
  }

  /* 底部金句 */
  .kicker {
    text-align: center;
    font-family: "Noto Serif SC", serif;
    font-size: 26px;
    font-weight: 700;
    font-style: italic;
    color: var(--brand-blue);
    padding: 18px 0;
    border-top: 2px solid #dbeafe;
    border-bottom: 2px solid #dbeafe;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="slide-title">中建电商——云筑网的产业互联网智能化</div>

<div class="honor-row">
  <div class="honor-tag">
    <div class="honor-icon">🏛️</div>
    <div class="honor-title">网信办备案</div>
    <div class="honor-desc">国家级算法备案通过</div>
  </div>
  <div class="honor-tag red">
    <div class="honor-icon">📋</div>
    <div class="honor-title">国家数据局典型案例</div>
    <div class="honor-desc">产业互联网数据要素标杆</div>
  </div>
  <div class="honor-tag">
    <div class="honor-icon">🏆</div>
    <div class="honor-title">中建数字化转型一等奖</div>
    <div class="honor-desc">集团级最高数字化荣誉</div>
  </div>
</div>

<div class="stats-grid">
  <div class="stat-card">
    <div class="big-num red">40<span class="unit">%</span></div>
    <div class="stat-arrow">↓</div>
    <div class="stat-label">采购周期缩短</div>
  </div>
  <div class="stat-card">
    <div class="big-num green">20<span class="unit">%</span></div>
    <div class="stat-arrow">↓</div>
    <div class="stat-label">综合成本降低</div>
  </div>
  <div class="stat-card">
    <div class="big-num">30<span class="unit">秒</span></div>
    <div class="stat-arrow">⚡</div>
    <div class="stat-label">约标响应时间</div>
  </div>
  <div class="stat-card">
    <div class="big-num green">75<span class="unit">%</span></div>
    <div class="stat-arrow">↓</div>
    <div class="stat-label">合规风险降低</div>
  </div>
</div>

<div class="stats-grid" style="margin-top: 16px;">
  <div class="stat-card">
    <div class="big-num">110<span class="unit">万+</span></div>
    <div class="stat-label">注册供应商</div>
  </div>
  <div class="stat-card">
    <div class="big-num">500<span class="unit">万次</span></div>
    <div class="stat-label">年搜索寻源</div>
  </div>
  <div class="stat-card">
    <div class="big-num">18<span class="unit">万份</span></div>
    <div class="stat-label">检测报告管理</div>
  </div>
  <div class="stat-card">
    <div class="big-num">1<span class="unit">个平台</span></div>
    <div class="stat-label">建筑产业互联网</div>
  </div>
</div>

<div class="kicker">
  "从'人找货'到'货找人'，从'纸质审批'到'智能合约'——云筑网正在重新定义建筑采购。"
</div>

<div class="page-footer">
  <span class="part-label">Part 3 · 同行压力与中建实践</span>
  <span class="page-num">27 / 47</span>
</div>

</body>
</html>
