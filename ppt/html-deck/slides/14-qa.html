<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P06 · 你可能在想什么</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/slide-system.css">
<style>
  body {
    padding: 50px 80px 30px;
    background: #fff;
    display: flex;
    flex-direction: column;
    height: 1080px;
  }

  .slide-title {
    margin-bottom: 40px;
  }

  /* 单张大卡片居中 */
  .qa-card {
    background: #fff;
    border: 2px solid #e2e8f0;
    border-radius: 16px;
    padding: 48px 56px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    position: relative;
    overflow: hidden;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
  }

  .qa-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
    background: linear-gradient(90deg, #1e40af, #2563eb);
  }

  .qa-card .qa-emoji {
    font-size: 56px;
    line-height: 1;
  }

  .qa-card .qa-q {
    font-size: 36px;
    font-weight: 800;
    color: #0f172a;
    line-height: 1.4;
  }

  .qa-card .qa-a {
    font-size: 22px;
    color: #475569;
    line-height: 1.8;
  }

  .qa-card .qa-a b {
    color: #1e40af;
    font-weight: 700;
  }

  /* 底部金句 */
  .foot-kicker {
    text-align: center;
    padding: 32px 0;
    border-top: 2px solid #e2e8f0;
    margin-top: auto;
  }

  .foot-kicker .line {
    font-family: "Noto Serif SC", serif;
    font-size: 28px;
    font-weight: 700;
    font-style: italic;
    color: #0f172a;
    letter-spacing: 0.02em;
  }

  .foot-kicker .line .hl {
    color: var(--brand-blue);
  }

  .page-footer {
    display: flex;
    justify-content: space-between;
    font-size: var(--fs-xs);
    color: var(--ink-subtle);
    margin-top: 20px;
  }
  .page-footer .part-label { color: var(--brand-blue); font-weight: 600; }
  .page-footer .page-num { color: var(--ink-dim); }
</style>
</head>
<body>

<div class="slide-title">你可能在想什么</div>

<div class="qa-card">
  <div class="qa-emoji">🤔</div>
  <div class="qa-q">"AI 会不会替代我的岗位？"</div>
  <div class="qa-a">
    不会替代你的岗位，但会替代<b>不会用 AI 的你</b>。AI 是能力的放大器，不是岗位的替代者。会用 AI 的人，正在快速拉开与不会用的人之间的差距。
    <br><br>
    要回答这个问题，你得先知道 AI 到底是什么——往下看。
  </div>
</div>

<div class="foot-kicker">
  <div class="line">"AI 不是来替代你的，是来帮你把时间从'打杂'里<span class="hl">抢回来</span>的。"</div>
</div>

<div class="page-footer">
  <span class="part-label">Part 1 · 政策锚定</span>
  <span class="page-num">6 / 53</span>
</div>

</body>
</html>
