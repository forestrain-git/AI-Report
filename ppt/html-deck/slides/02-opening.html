<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P02 · 开场金句</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    padding: 60px 100px 40px;
    background: #fff;
    display: flex;
    flex-direction: column;
    height: 1080px;
    gap: 0;
  }

  /* ── 顶部金句区：大留白 + 粗竖线 ── */
  .hero-quote {
    padding-left: 32px;
    border-left: 8px solid var(--brand-blue);
    margin-bottom: 48px;
  }
  .hero-quote .big {
    font-family: "Noto Serif SC", "STSong", serif;
    font-size: 64px;
    font-weight: 700;
    font-style: italic;
    color: var(--ink-title);
    line-height: 1.25;
    letter-spacing: 0.02em;
  }
  .hero-quote .big .hl {
    color: var(--brand-blue);
  }
  .hero-quote .source {
    font-size: 22px;
    color: var(--ink-dim);
    margin-top: 16px;
    font-weight: 500;
  }

  /* ── 中间：左右两大色块对比 ── */
  .duel {
    display: grid;
    grid-template-columns: 1fr 80px 1fr;
    gap: 0;
    flex: 1;
    min-height: 0;
    margin-bottom: 48px;
  }
  .side {
    border-radius: 16px;
    padding: 40px 48px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .side.leader {
    background: linear-gradient(160deg, #eff6ff, #eef2ff);
    border: 2px solid #dbeafe;
  }
  .side.lagger {
    background: linear-gradient(160deg, #f8fafc, #f1f5f9);
    border: 2px solid #e2e8f0;
  }
  .side .side-title {
    font-size: 36px;
    font-weight: 800;
    text-align: center;
    padding-bottom: 20px;
    border-bottom: 3px solid;
  }
  .side.leader .side-title {
    color: var(--brand-blue);
    border-color: var(--brand-blue);
  }
  .side.lagger .side-title {
    color: var(--ink-dim);
    border-color: #cbd5e1;
  }
  .side .item {
    font-size: 24px;
    line-height: 1.5;
    color: var(--ink-body);
    padding-left: 28px;
    position: relative;
  }
  .side .item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 12px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .side.leader .item::before { background: var(--brand-blue); }
  .side.lagger .item::before { background: #cbd5e1; }
  .side .item .dim {
    display: block;
    font-size: 18px;
    color: var(--ink-dim);
    font-weight: 600;
    margin-bottom: 4px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .vs-col {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .vs-badge {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 800;
    color: var(--ink-subtle);
    font-family: "Inter", sans-serif;
  }

  /* ── 底部金句：红线分隔 + 大号红字 ── */
  .foot-kicker {
    border-top: 2px solid #fecaca;
    border-bottom: 2px solid #fecaca;
    padding: 28px 0;
    text-align: center;
  }
  .foot-kicker .line {
    font-family: "Noto Serif SC", serif;
    font-size: 36px;
    font-weight: 700;
    font-style: italic;
    color: var(--red);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

<div class="hero-quote">
  <div class="big">"这不是技术选项，<br>这是<span class="hl">政治任务</span>。"</div>
  <div class="source">—— AI 推进力度已纳入央企负责人经营业绩考核</div>
</div>

<div class="duel">
  <div class="side leader">
    <div class="side-title">先行央企</div>
    <div class="item">
      <span class="dim">政策红利</span>
      被树为典型，获得政策倾斜
    </div>
    <div class="item">
      <span class="dim">人才争夺</span>
      吸引 AI 人才，形成技术壁垒
    </div>
    <div class="item">
      <span class="dim">市场竞争力</span>
      降本增效，报价更有优势
    </div>
    <div class="item">
      <span class="dim">政绩考核</span>
      数字化指标加分
    </div>
  </div>

  <div class="vs-col">
    <div class="vs-badge">VS</div>
  </div>

  <div class="side lagger">
    <div class="side-title">滞后企业</div>
    <div class="item">
      <span class="dim">政策红利</span>
      只能交作业，被动追赶
    </div>
    <div class="item">
      <span class="dim">人才争夺</span>
      人才流失，技术代差扩大
    </div>
    <div class="item">
      <span class="dim">市场竞争力</span>
      成本居高不下，招投标失利
    </div>
    <div class="item">
      <span class="dim">政绩考核</span>
      考核扣分，领导责任
    </div>
  </div>
</div>

<div class="foot-kicker">
  <div class="line">"不做 AI 的国企正在被重构。"</div>
</div>

<div class="page-footer">
  <span class="part-label">Part 1 · 政策锚定</span>
  <span class="page-num">2 / 47</span>
</div>

</body>
</html>
