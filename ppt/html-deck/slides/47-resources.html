<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P47 · 会后学习资源包</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/slide-system.css">
<style>
  body {
    padding: 50px 80px 30px;
    background: #fff;
    display: flex;
    flex-direction: column;
    height: 1080px;
  }
  .slide-title { margin-bottom: 16px; }
  .slide-lead { margin-bottom: 28px; }

  /* 五列卡片 */
  .resources-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
    flex: 1;
    min-height: 0;
  }
  .resource-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 12px;
  }
  .resource-card .res-num {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--brand-blue);
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .resource-card .res-qr {
    width: 140px;
    height: 140px;
    background: #e2e8f0;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--ink-subtle);
    flex-shrink: 0;
  }
  .resource-card .res-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink-title);
    line-height: 1.3;
  }
  .resource-card .res-desc {
    font-size: 14px;
    color: var(--ink-dim);
    line-height: 1.5;
  }
  .resource-card.primary {
    border-color: #93c5fd;
    background: linear-gradient(180deg, #eff6ff, #fff);
    box-shadow: 0 4px 16px rgba(30,64,175,0.08);
  }
  .resource-card.primary .res-num {
    background: var(--red);
  }

  /* 底部金句 */
  .kicker.blue {
    margin-top: 20px;
    font-size: 24px;
  }
</style>
</head>
<body>

<h1 class="slide-title">会后学习资源包</h1>
<p class="slide-lead">扫码即学，学了就用，用了再学</p>

<div class="resources-grid">
  <div class="resource-card primary">
    <div class="res-num">1</div>
    <div class="res-qr">二维码占位</div>
    <div class="res-name">AI 快速入门指南</div>
    <div class="res-desc">按角色定制，2 小时见效<br>推荐首选</div>
  </div>
  <div class="resource-card">
    <div class="res-num">2</div>
    <div class="res-qr">二维码占位</div>
    <div class="res-name">吴恩达 AI 通识课</div>
    <div class="res-desc">6 小时系统学习<br>Coursera 免费</div>
  </div>
  <div class="resource-card">
    <div class="res-num">3</div>
    <div class="res-qr">二维码占位</div>
    <div class="res-name">30 天 AI 实战挑战</div>
    <div class="res-desc">每天 15 分钟<br>养成 AI 工作习惯</div>
  </div>
  <div class="resource-card">
    <div class="res-num">4</div>
    <div class="res-qr">二维码占位</div>
    <div class="res-name">工具速查卡</div>
    <div class="res-desc">3 分钟上手<br>常用工具一览</div>
  </div>
  <div class="resource-card">
    <div class="res-num">5</div>
    <div class="res-qr">二维码占位</div>
    <div class="res-name">AI 学习社群</div>
    <div class="res-desc">持续更新<br>同行交流互助</div>
  </div>
</div>

<div class="kicker blue">
  "最懂业务的人，现在最懂 AI。从今天开始。"
</div>

<div class="page-footer">
  <span class="part-label">附录</span>
  <span class="page-num">47 / 47</span>
</div>

</body>
</html>
