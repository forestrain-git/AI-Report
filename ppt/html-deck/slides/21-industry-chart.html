<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P21 · 全球传统企业AI转型</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/slide-system.css">
<style>
  body {
    padding: 50px 80px 30px;
    background: #fff;
    display: flex;
    flex-direction: column;
    height: 1080px;
  }
  .main-area {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 32px;
    flex: 1;
    min-height: 0;
  }
  /* 左侧柱状图 */
  .chart-panel {
    background: #f8fafc;
    border-radius: 16px;
    padding: 32px 36px;
    border: 1px solid #e2e8f0;
    display: flex;
    flex-direction: column;
    gap: 20px;
    justify-content: center;
  }
  .chart-title {
    font-size: 22px;
    font-weight: 800;
    color: var(--ink-title);
    margin-bottom: 8px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .bar-label {
    font-size: 17px;
    font-weight: 600;
    color: var(--ink-body);
    min-width: 80px;
    text-align: right;
  }
  .bar-track {
    flex: 1;
    height: 36px;
    background: #e2e8f0;
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 12px;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    transition: width 0.6s ease;
  }
  .bar-fill.blue { background: linear-gradient(90deg, #3b82f6, #1e40af); }
  .bar-fill.cyan { background: linear-gradient(90deg, #0ea5e9, #0891b2); }
  .bar-fill.teal { background: linear-gradient(90deg, #14b8a6, #0d9488); }
  .bar-fill.orange { background: linear-gradient(90deg, #f97316, #ea580c); }
  .bar-fill.red { background: linear-gradient(90deg, #ef4444, #dc2626); }
  .bar-fill.construction {
    background: linear-gradient(90deg, #dc2626, #b91c1c);
    box-shadow: 0 0 12px rgba(220,38,38,0.3);
  }
  .bar-value {
    font-size: 17px;
    font-weight: 800;
    color: var(--ink-title);
    min-width: 60px;
  }
  .bar-value.red { color: var(--red); }

  /* 右侧信号卡片 */
  .signals-panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
    justify-content: center;
  }
  .signal-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }
  .signal-card .sig-num {
    font-family: "Inter", sans-serif;
    font-size: 36px;
    font-weight: 800;
    color: var(--brand-blue);
    line-height: 1.1;
  }
  .signal-card .sig-num.red { color: var(--red); }
  .signal-card .sig-desc {
    font-size: 18px;
    color: var(--ink-body);
    line-height: 1.5;
  }
  .signal-card .sig-source {
    font-size: 14px;
    color: var(--ink-subtle);
    margin-top: 4px;
  }

  /* 底部金句 */
  .kicker {
    text-align: center;
    font-family: "Noto Serif SC", serif;
    font-size: 28px;
    font-weight: 700;
    font-style: italic;
    color: var(--brand-blue);
    padding: 20px 0;
    border-top: 2px solid #dbeafe;
    border-bottom: 2px solid #dbeafe;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="slide-title">全球传统企业AI转型——从"试点"到"核心"</div>

<div class="main-area">
  <!-- 左侧：水平柱状图 -->
  <div class="chart-panel">
    <div class="chart-title">行业 AI 核心业务嵌入率</div>
    <div class="bar-row">
      <div class="bar-label">金融</div>
      <div class="bar-track">
        <div class="bar-fill blue" style="width: 78%;">78%</div>
      </div>
    </div>
    <div class="bar-row">
      <div class="bar-label">制造</div>
      <div class="bar-track">
        <div class="bar-fill cyan" style="width: 72%;">72%</div>
      </div>
    </div>
    <div class="bar-row">
      <div class="bar-label">零售</div>
      <div class="bar-track">
        <div class="bar-fill teal" style="width: 65%;">65%</div>
      </div>
    </div>
    <div class="bar-row">
      <div class="bar-label">医疗</div>
      <div class="bar-track">
        <div class="bar-fill orange" style="width: 55%;">55%</div>
      </div>
    </div>
    <div class="bar-row">
      <div class="bar-label">建筑业</div>
      <div class="bar-track">
        <div class="bar-fill construction" style="width: 8%;">1.5%</div>
      </div>
    </div>
  </div>

  <!-- 右侧：四个转型信号 -->
  <div class="signals-panel">
    <div class="signal-card">
      <div class="sig-num">90%</div>
      <div class="sig-desc">Taisei（大成建设）AI 平台活跃率</div>
      <div class="sig-source">日本最大建筑商之一，全员渗透</div>
    </div>
    <div class="signal-card">
      <div class="sig-num">强制培训</div>
      <div class="sig-desc">Eiffage 要求全员完成 AI 工具认证</div>
      <div class="sig-source">法国第三大建筑集团</div>
    </div>
    <div class="signal-card">
      <div class="sig-num">600万</div>
      <div class="sig-desc">Bouygues 10 分钟生成 <b>600 万种</b>施工方案</div>
      <div class="sig-source">从"人想方案"到"AI枚举最优"</div>
    </div>
    <div class="signal-card">
      <div class="sig-num red">80%</div>
      <div class="sig-desc">Kajima 劳动力减少 <b>80%</b>，零事故</div>
      <div class="sig-source">3 人操作 14 台机械，自动化+AI</div>
    </div>
  </div>
</div>

<div class="kicker">
  "建筑业的 1.5% 不是落后的证据，是领先的机会窗口。"
</div>

<div class="page-footer">
  <span class="part-label">Part 3 · 同行压力</span>
  <span class="page-num">21 / 47</span>
</div>

</body>
</html>
