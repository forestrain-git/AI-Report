<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P01 · 封面</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    background: radial-gradient(ellipse at 30% 20%, #132744 0%, #0B1A30 60%, #060F1E 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .bg-decor {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .grid-lines {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 80px 80px;
  }
  .glow-red {
    position: absolute;
    top: -200px;
    right: -100px;
    width: 900px;
    height: 900px;
    background: radial-gradient(circle, rgba(196,30,58,0.12) 0%, transparent 70%);
  }
  .glow-gold {
    position: absolute;
    bottom: -300px;
    left: -100px;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(200,162,76,0.08) 0%, transparent 70%);
  }

  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 1400px;
    padding: 0 80px;
  }

  .org-line {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.3em;
    color: var(--gold-light);
    margin-bottom: 48px;
    text-transform: uppercase;
  }

  .title-main {
    font-size: 96px;
    font-weight: 900;
    line-height: 1.2;
    letter-spacing: 0.06em;
    color: #fff;
    margin-bottom: 24px;
  }
  .title-main .red {
    color: var(--red);
  }
  .title-sub {
    font-size: 36px;
    color: rgba(255,255,255,0.55);
    font-weight: 300;
    letter-spacing: 0.15em;
    margin-bottom: 72px;
  }

  .divider {
    width: 120px;
    height: 3px;
    background: var(--red);
    margin: 0 auto 72px;
  }

  .nav-strip {
    display: flex;
    gap: 0;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.08em;
  }
  .nav-item {
    padding: 10px 24px;
    border: 1px solid rgba(255,255,255,0.12);
    margin: 0 -1px;
    white-space: nowrap;
    font-weight: 500;
  }
  .nav-item:first-child { border-radius: 6px 0 0 6px; }
  .nav-item:last-child  { border-radius: 0 6px 6px 0; }
  .nav-item.highlight {
    background: rgba(196,30,58,0.2);
    border-color: rgba(196,30,58,0.4);
    color: #f0a0a0;
  }

  .footer-info {
    position: absolute;
    bottom: 48px;
    left: 80px;
    right: 80px;
    display: flex;
    justify-content: space-between;
    font-size: 16px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>

<div class="bg-decor">
  <div class="grid-lines"></div>
  <div class="glow-red"></div>
  <div class="glow-gold"></div>
</div>

<div class="content">
  <div class="org-line">中建发展</div>

  <div class="title-main">
    AI 时代：<span class="red">国企</span>的选择与行动
  </div>
  <div class="title-sub">从认知到落地的实践指南</div>

  <div class="divider"></div>

  <div class="nav-strip">
    <span class="nav-item highlight">政策锚定</span>
    <span class="nav-item">→</span>
    <span class="nav-item">技术祛魅</span>
    <span class="nav-item">→</span>
    <span class="nav-item highlight">同行压力</span>
    <span class="nav-item">→</span>
    <span class="nav-item">落地路径</span>
    <span class="nav-item">→</span>
    <span class="nav-item">行动倡议</span>
  </div>
</div>

<div class="footer-info">
  <span>中建发展 · AI 宣讲</span>
  <span>2026.06</span>
</div>

</body>
</html>
